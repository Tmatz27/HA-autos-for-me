alias: Bedroom Fan - Bedtime Kickoff
description: >-
  Once the bedroom TV goes unavailable after 8pm (signaling the TV-off hatch
  routine has kicked off bedtime), turn the bedroom fan to cool/high and
  enter the night humidity-management phase.
triggers:
  - trigger: state
    entity_id: media_player.lg_webos_tv_oled65c2pua
    to: "unavailable"
    for:
      seconds: 10
conditions:
  - condition: time
    after: "20:00:00"
    before: "23:59:59"
actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.bedroom_fan_night_phase
  - action: script.bedroom_fan_set_state
    data:
      target_function: cool
      target_speed: high
mode: restart
