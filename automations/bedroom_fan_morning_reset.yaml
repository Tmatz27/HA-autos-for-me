alias: Bedroom Fan - Morning Reset
description: >-
  Ends the night phase once outdoor humidity has dropped to a reasonable
  level (or by 10am at the latest, whichever comes first), resets the fan to
  cool/high, and hands control over to the daytime humidity cycle.
triggers:
  - trigger: numeric_state
    entity_id: sensor.aso_vandenberg_humidity
    below: 75
  - trigger: time
    at: "10:00:00"
conditions:
  - condition: state
    entity_id: input_boolean.bedroom_fan_night_phase
    state: "on"
actions:
  - action: script.bedroom_fan_set_state
    data:
      target_function: cool
      target_speed: high
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.bedroom_fan_night_phase
mode: single
