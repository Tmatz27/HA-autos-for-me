# These can be created either by pasting into configuration.yaml (if you run
# helpers in YAML mode) or, more simply, via Settings -> Devices & Services ->
# Helpers -> Create Helper in the UI:
#   - Toggle named "Bedroom Fan Night Phase" (input_boolean.bedroom_fan_night_phase)
#   - Date & time named "Bedroom Fan Last Command Time" (input_datetime.bedroom_fan_last_command_time,
#     with both date and time enabled)
#
# night_phase = on means we're in the bedtime-to-morning-reset window and the
# night cycle automation is allowed to run. off means the daytime cycle runs
# instead. last_command_time is a shared debounce timestamp so the night and
# day cycle automations don't send fan commands more than once every 30
# minutes (to avoid nonstop beeping while thresholds hover near the edge).

input_boolean:
  bedroom_fan_night_phase:
    name: Bedroom Fan Night Phase

input_datetime:
  bedroom_fan_last_command_time:
    name: Bedroom Fan Last Command Time
    has_date: true
    has_time: true
