# Lovelace card for manual fan control + status display. Requires the
# Mushroom cards (custom:mushroom-*) installed via HACS. Add this as a card
# in your dashboard's YAML editor (or a whole view). Lovelace has no
# blueprint/input system, so to reuse for another fan, copy this file and
# replace every entity id referenced below.
type: vertical-stack
cards:
  - type: custom:mushroom-title-card
    title: Bedroom Fan
    subtitle: >-
      {% set s = states('sensor.bedroom_fan_state') %}
      {% if s == 'off' %}Powered Off
      {% elif s == 'circulate' %}Circulate
      {% elif '_' in s %}{{ s.split('_')[0] | title }} · {{ s.split('_')[1] | title }}
      {% else %}Unknown
      {% endif %}

  - type: horizontal-stack
    cards:
      - type: custom:mushroom-template-card
        primary: "{{ states('sensor.master_air_quality_temperature') }} °F"
        secondary: Room Temp
        icon: mdi:thermometer
        icon_color: >-
          {% set t = states('sensor.master_air_quality_temperature') | float(0) %}
          {% if t >= 75 %}red
          {% elif t <= 62 %}blue
          {% else %}amber
          {% endif %}
      - type: custom:mushroom-template-card
        primary: "{{ states('sensor.master_air_quality_humidity') }}%"
        secondary: Room Humidity
        icon: mdi:water-percent
        icon_color: >-
          {% set h = states('sensor.master_air_quality_humidity') | float(0) %}
          {% if h >= 75 %}red
          {% elif h <= 60 %}green
          {% else %}amber
          {% endif %}

  - type: horizontal-stack
    cards:
      - type: custom:mushroom-template-card
        primary: Cool
        icon: mdi:snowflake
        layout: vertical
        icon_color: "{{ 'blue' if 'cool' in states('sensor.bedroom_fan_state') else 'disabled' }}"
        fill_container: true
        tap_action:
          action: call-service
          service: script.bedroom_fan_set_state
          data:
            target_function: cool
            target_speed: >-
              {% set s = states('sensor.bedroom_fan_state') %}
              {{ s.split('_')[1] if '_' in s else 'high' }}
      - type: custom:mushroom-template-card
        primary: Exhaust
        icon: mdi:fan
        layout: vertical
        icon_color: "{{ 'orange' if 'exhaust' in states('sensor.bedroom_fan_state') else 'disabled' }}"
        fill_container: true
        tap_action:
          action: call-service
          service: script.bedroom_fan_set_state
          data:
            target_function: exhaust
            target_speed: >-
              {% set s = states('sensor.bedroom_fan_state') %}
              {{ s.split('_')[1] if '_' in s else 'high' }}

  - type: horizontal-stack
    cards:
      - type: custom:mushroom-template-card
        primary: Low
        icon: mdi:speedometer-slow
        layout: vertical
        icon_color: "{{ 'green' if states('sensor.bedroom_fan_state').endswith('low') else 'disabled' }}"
        fill_container: true
        tap_action:
          action: call-service
          service: script.bedroom_fan_set_state
          data:
            target_function: "{{ 'exhaust' if 'exhaust' in states('sensor.bedroom_fan_state') else 'cool' }}"
            target_speed: low
      - type: custom:mushroom-template-card
        primary: Med
        icon: mdi:speedometer-medium
        layout: vertical
        icon_color: "{{ 'amber' if states('sensor.bedroom_fan_state').endswith('med') else 'disabled' }}"
        fill_container: true
        tap_action:
          action: call-service
          service: script.bedroom_fan_set_state
          data:
            target_function: "{{ 'exhaust' if 'exhaust' in states('sensor.bedroom_fan_state') else 'cool' }}"
            target_speed: med
      - type: custom:mushroom-template-card
        primary: High
        icon: mdi:speedometer
        layout: vertical
        icon_color: "{{ 'red' if states('sensor.bedroom_fan_state').endswith('high') else 'disabled' }}"
        fill_container: true
        tap_action:
          action: call-service
          service: script.bedroom_fan_set_state
          data:
            target_function: "{{ 'exhaust' if 'exhaust' in states('sensor.bedroom_fan_state') else 'cool' }}"
            target_speed: high

  - type: horizontal-stack
    cards:
      - type: custom:mushroom-entity-card
        entity: input_boolean.bedroom_fan_manual_override
        name: Manual Override
        secondary_info: >-
          {{ 'Automation paused' if is_state('input_boolean.bedroom_fan_manual_override', 'on') else 'Automation active' }}
        icon: mdi:hand-back-right
        icon_color: "{{ 'amber' if is_state('input_boolean.bedroom_fan_manual_override', 'on') else 'disabled' }}"
        tap_action:
          action: toggle
      - type: custom:mushroom-entity-card
        entity: switch.master_fan_plug
        name: Fan Power
        icon: mdi:power
        icon_color: "{{ 'green' if is_state('switch.master_fan_plug', 'on') else 'disabled' }}"
        tap_action:
          action: toggle
