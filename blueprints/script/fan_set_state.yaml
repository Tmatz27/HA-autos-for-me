blueprint:
  name: Fan - Set State (Function/Speed via IR Remote)
  description: >-
    Sets a remote-controlled dual-function fan (e.g. cool/exhaust/circulate,
    low/med/high) to a target function and speed. Because most IR remotes
    give no feedback, this reads the fan's current decoded state from a
    template sensor (based on smart-plug wattage) and computes exactly how
    many times to press the physical remote's mode/speed toggle buttons to
    reach the target - no assumed/drifting state, no blind power-cycling.
    Powers the fan on via its smart plug switch first if it's currently off.
    Call with fields target_function (cool/exhaust) and target_speed
    (low/med/high).
  domain: script
  input:
    remote_entity:
      name: Remote
      description: The remote entity (e.g. Broadlink) that controls this fan.
      selector:
        entity:
          domain: remote
    ir_device_name:
      name: IR Device Name
      description: >-
        The device name used when the IR codes were learned in the remote
        integration (e.g. "Master Fan").
      selector:
        text:
    mode_command:
      name: Mode/Function Toggle Command
      description: Command name that cycles cool -> exhaust -> circulate -> cool.
      default: mode_toggle
      selector:
        text:
    speed_command:
      name: Speed Toggle Command
      description: Command name that cycles low -> med -> high -> low.
      default: speed_toggle
      selector:
        text:
    press_delay_seconds:
      name: Delay Between Presses
      description: How long to wait between repeated button presses (for the fan's beep/settle time).
      default: 2
      selector:
        number:
          min: 0.5
          max: 10
          step: 0.5
          unit_of_measurement: seconds
          mode: box
    power_switch_entity:
      name: Power Switch
      description: >-
        The smart plug switch entity the fan is plugged into. Used to power
        the fan on/off deterministically instead of the remote's power
        toggle button.
      selector:
        entity:
          domain: switch
    fan_state_sensor:
      name: Fan State Sensor
      description: >-
        The template sensor decoding this fan's function/speed from plug
        wattage. Must report "off" when powered down.
      selector:
        entity:
          domain: sensor
    last_command_datetime:
      name: Last Command Timestamp Helper
      description: An input_datetime updated after every command, used by the cycle automations to debounce.
      selector:
        entity:
          domain: input_datetime

fields:
  target_function:
    name: Target Function
    selector:
      select:
        options:
          - "cool"
          - "exhaust"
  target_speed:
    name: Target Speed
    selector:
      select:
        options:
          - "low"
          - "med"
          - "high"

sequence:
  - variables:
      remote_entity: !input remote_entity
      ir_device_name: !input ir_device_name
      mode_command: !input mode_command
      speed_command: !input speed_command
      press_delay: !input press_delay_seconds
      power_switch_entity: !input power_switch_entity
      fan_state_sensor: !input fan_state_sensor
      last_command_datetime: !input last_command_datetime
  - if:
      - condition: template
        value_template: "{{ states(fan_state_sensor) == 'off' }}"
    then:
      - action: switch.turn_on
        target:
          entity_id: "{{ power_switch_entity }}"
      - wait_template: "{{ states(fan_state_sensor) != 'off' }}"
        timeout: "00:00:15"
      - delay: "00:00:01"
  - variables:
      state_now: "{{ states(fan_state_sensor) }}"
      current_function: >
        {% if 'exhaust' in state_now %}exhaust
        {% elif 'cool' in state_now %}cool
        {% else %}circulate
        {% endif %}
      current_speed: >
        {% if 'low' in state_now %}low
        {% elif 'med' in state_now %}med
        {% else %}high
        {% endif %}
      function_order: ["cool", "exhaust", "circulate"]
      speed_order: ["low", "med", "high"]
      function_presses: >
        {{ (function_order.index(target_function) - function_order.index(current_function)) % 3 }}
      speed_presses: >
        {{ (speed_order.index(target_speed) - speed_order.index(current_speed)) % 3 }}
  - repeat:
      count: "{{ function_presses | int }}"
      sequence:
        - action: remote.send_command
          target:
            entity_id: "{{ remote_entity }}"
          data:
            device: "{{ ir_device_name }}"
            command: "{{ mode_command }}"
        - delay: "{{ press_delay }}"
  - repeat:
      count: "{{ speed_presses | int }}"
      sequence:
        - action: remote.send_command
          target:
            entity_id: "{{ remote_entity }}"
          data:
            device: "{{ ir_device_name }}"
            command: "{{ speed_command }}"
        - delay: "{{ press_delay }}"
  - action: input_datetime.set_datetime
    target:
      entity_id: "{{ last_command_datetime }}"
    data:
      timestamp: "{{ now().timestamp() }}"
mode: queued
