blueprint:
  name: Fan - Bedtime Kickoff
  description: >-
    When a trigger entity (typically a bedroom TV going unavailable) fires
    within a time window, sets the fan to a target function/speed and turns
    on a "night phase" helper so night-cycle automations know to take over.
  domain: automation
  input:
    trigger_entity:
      name: Trigger Entity
      description: Usually the bedroom TV media_player.
      selector:
        entity:
    trigger_to_state:
      name: Trigger Target State
      default: "unavailable"
      selector:
        text:
    trigger_for_seconds:
      name: Debounce Seconds
      default: 10
      selector:
        number:
          min: 0
          max: 300
          mode: box
    after_time:
      name: Earliest Time
      default: "20:00:00"
      selector:
        time:
    before_time:
      name: Latest Time
      default: "23:59:59"
      selector:
        time:
    night_phase_boolean:
      name: Night Phase Helper
      selector:
        entity:
          domain: input_boolean
    manual_override_boolean:
      name: Manual Override Helper
      description: Cleared automatically at bedtime so a forgotten override doesn't block humidity control overnight.
      selector:
        entity:
          domain: input_boolean
    set_state_script:
      name: Fan Set-State Script
      selector:
        entity:
          domain: script
    target_function:
      name: Target Function
      default: cool
      selector:
        select:
          options:
            - "cool"
            - "exhaust"
    target_speed:
      name: Target Speed
      default: high
      selector:
        select:
          options:
            - "low"
            - "med"
            - "high"

triggers:
  - trigger: state
    entity_id: !input trigger_entity
    to: !input trigger_to_state
    for:
      seconds: !input trigger_for_seconds
conditions:
  - condition: time
    after: !input after_time
    before: !input before_time
variables:
  night_phase_boolean: !input night_phase_boolean
  manual_override_boolean: !input manual_override_boolean
  set_state_script: !input set_state_script
  target_function: !input target_function
  target_speed: !input target_speed
actions:
  - action: input_boolean.turn_on
    target:
      entity_id: "{{ night_phase_boolean }}"
  - action: input_boolean.turn_off
    target:
      entity_id: "{{ manual_override_boolean }}"
  - action: "{{ set_state_script }}"
    data:
      target_function: "{{ target_function }}"
      target_speed: "{{ target_speed }}"
mode: restart
