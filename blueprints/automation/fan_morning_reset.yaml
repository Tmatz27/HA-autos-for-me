blueprint:
  name: Fan - Morning Reset
  description: >-
    Ends the night phase once an outdoor humidity sensor drops below a
    threshold, or by a fallback time at the latest (whichever comes first),
    resets the fan to a target function/speed, and hands control to the
    daytime cycle automation.
  domain: automation
  input:
    outdoor_humidity_sensor:
      name: Outdoor Humidity Sensor
      selector:
        entity:
          domain: sensor
          device_class: humidity
    outdoor_humidity_threshold:
      name: Outdoor Humidity Threshold (%)
      default: 75
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
          mode: box
    fallback_time:
      name: Fallback Time
      description: Resets the fan at this time even if outdoor humidity hasn't dropped yet.
      default: "10:00:00"
      selector:
        time:
    night_phase_boolean:
      name: Night Phase Helper
      selector:
        entity:
          domain: input_boolean
    set_state_script:
      name: Fan Set-State Script
      selector:
        entity:
          domain: script
    target_function:
      name: Target Function
      default: cool
      selector:
        select:
          options:
            - "cool"
            - "exhaust"
    target_speed:
      name: Target Speed
      default: high
      selector:
        select:
          options:
            - "low"
            - "med"
            - "high"

triggers:
  - trigger: numeric_state
    entity_id: !input outdoor_humidity_sensor
    below: !input outdoor_humidity_threshold
  - trigger: time
    at: !input fallback_time
conditions:
  - condition: state
    entity_id: !input night_phase_boolean
    state: "on"
variables:
  night_phase_boolean: !input night_phase_boolean
  set_state_script: !input set_state_script
  target_function: !input target_function
  target_speed: !input target_speed
actions:
  - action: "{{ set_state_script }}"
    data:
      target_function: "{{ target_function }}"
      target_speed: "{{ target_speed }}"
  - action: input_boolean.turn_off
    target:
      entity_id: "{{ night_phase_boolean }}"
mode: single
