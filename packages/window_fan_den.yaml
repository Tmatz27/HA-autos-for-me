# Den window fan controller 1.5.0. Replace the previous den package.
# Configure HARDWARE in build.py and ranges/settings in den_controller.py, then regenerate.
input_boolean:
  den_fan_command_fault:
    name: "Den Fan Command Fault"
  den_fan_boot_pending:
    name: "Den Fan Startup Pending"
input_select:
  den_fan_confirmed_state:
    name: "Den Fan Confirmed State"
    options:
      - "unknown"
      - "off"
      - "cool_low"
      - "cool_med"
      - "cool_high"
      - "exhaust_low"
      - "exhaust_med"
      - "exhaust_high"
      - "circulate_low"
      - "circulate_med"
      - "circulate_high"
  den_fan_cycle:
    name: "Den Fan Cycle"
    options:
      - "normal"
      - "burst"
      - "extended"
      - "recovery"
  den_fan_requested_mode:
    name: "Den Fan Requested Mode"
    options:
      - "cool"
      - "exhaust"
      - "circulate"
  den_fan_requested_speed:
    name: "Den Fan Requested Speed"
    options:
      - "low"
      - "med"
      - "high"
  den_fan_manual_mode:
    name: "Den Fan Manual Mode"
    options:
      - "cool"
      - "exhaust"
      - "circulate"
  den_fan_manual_speed:
    name: "Den Fan Manual Speed"
    options:
      - "low"
      - "med"
      - "high"
input_datetime:
  den_fan_manual_until:
    name: "Den Fan Manual Until"
    has_date: true
    has_time: true
  den_fan_cycle_end:
    name: "Den Fan Cycle End"
    has_date: true
    has_time: true
  den_fan_command_guard_until:
    name: "Den Fan Command Guard Until"
    has_date: true
    has_time: true
  den_fan_last_command_time:
    name: "Den Fan Last Command Time"
    has_date: true
    has_time: true
input_text:
  den_fan_reason:
    name: "Den Fan Reason"
    max: 255
  den_fan_error:
    name: "Den Fan Error"
    max: 255
template:
  - sensor:
      - name: "Den Fan Power Candidates"
        unique_id: "den_fan_power_candidates"
        state: "{% set p = states('sensor.den_fan_power') %}{% if not is_number(p) or p | float < 0 %}unknown{% elif p | float < 10 %}off{% else %}{% set ranges = {\"cool_low\": [46, 47], \"cool_med\": [48, 50], \"cool_high\": [50, 53], \"exhaust_low\": [32, 33], \"exhaust_med\": [34, 35], \"exhaust_high\": [35, 38], \"circulate_low\": [39, 40], \"circulate_med\": [42, 43], \"circulate_high\": [44, 46]} %}{% set ns = namespace(matches=[]) %}{% for name, bounds in ranges.items() %}{% if bounds[0] - 0.5 <= p | float <= bounds[1] + 0.5 %}{% set ns.matches = ns.matches + [name] %}{% endif %}{% endfor %}{{ ns.matches | join('|') if ns.matches else 'unknown' }}{% endif %}"
      - name: "Den Fan State"
        unique_id: "den_fan_state"
        icon: "mdi:fan"
        state: "{% set seen = states('sensor.den_fan_power_candidates').split('|') %}{% set known = states('input_select.den_fan_confirmed_state') %}{{ known if known in seen and known != 'unknown' else 'unknown' }}"
        attributes:
          power_sensor: "sensor.den_fan_power"
          calibration_prefix: "den_fan"
          manual_control: "{{ true }}"
          controller_script: "script.den_fan_set_state"
          status_sensor: "sensor.den_fan_control_status"
          temperature_sensor: "sensor.den_temperature"
          humidity_sensor: "sensor.den_humidity"
          calibration_kind: "ranges"
          calibration_ranges: "{{ {\"cool_low\": [46, 47], \"cool_med\": [48, 50], \"cool_high\": [50, 53], \"exhaust_low\": [32, 33], \"exhaust_med\": [34, 35], \"exhaust_high\": [35, 38], \"circulate_low\": [39, 40], \"circulate_med\": [42, 43], \"circulate_high\": [44, 46]} }}"
          controller_version: "1.5.0"
          range_tolerance: "{{ 0.5 }}"
          confirm_script: "script.den_fan_confirm_state"
          confidence: "{{ 'unconfirmed' if is_state('sensor.den_fan_state','unknown') else ('tracked' if '|' in states('sensor.den_fan_power_candidates') else 'measured') }}"
      - name: "Den Fan Control Status"
        unique_id: "den_fan_control_status"
        icon: "mdi:fan-auto"
        state: "{% if (state_attr('input_datetime.den_fan_manual_until', 'timestamp') | float(0)) > now().timestamp() %}Manual hold{% elif states('input_text.den_fan_reason').startswith('Manual') %}Manual hold ended; awaiting Auto evaluation{% else %}{{ states('input_text.den_fan_reason') }}{% endif %}"
        attributes:
          manual_until_timestamp: "{{ (state_attr('input_datetime.den_fan_manual_until', 'timestamp') | float(0)) }}"
          manual_active: "{{ (state_attr('input_datetime.den_fan_manual_until', 'timestamp') | float(0)) > now().timestamp() }}"
          error: "{{ states('input_text.den_fan_error') }}"
          requested_mode: "{{ states('input_select.den_fan_requested_mode') }}"
          requested_speed: "{{ states('input_select.den_fan_requested_speed') }}"
          cycle: "{{ states('input_select.den_fan_cycle') }}"
          cycle_end_timestamp: "{{ (state_attr('input_datetime.den_fan_cycle_end', 'timestamp') | float(0)) }}"
          blocked: "{{ is_state('input_boolean.den_fan_command_fault','on') }}"
          controller_version: "1.5.0"
script:
  den_fan_set_state:
    alias: "Den Fan - Serialized Controller"
    mode: "queued"
    max: 10
    max_exceeded: "silent"
    trace:
      stored_traces: 20
    fields:
      event:
        selector:
          select:
            options:
              - "evaluate"
              - "observe"
              - "startup"
              - "manual"
              - "resume_auto"
              - "synchronize"
      target_function:
        selector:
          select:
            options:
              - "cool"
              - "exhaust"
              - "circulate"
      target_speed:
        selector:
          select:
            options:
              - "low"
              - "med"
              - "high"
    sequence:
      - variables:
          cfg:
            power: "sensor.den_fan_power"
            plug: "switch.den_fan_plug"
            remote: "remote.den_fan_remote"
            device: "Den Fan"
            mode_command: "mode_toggle"
            speed_command: "speed_toggle"
            power_command: ""
            temperature: "sensor.den_temperature"
            humidity: "sensor.den_humidity"
            manual_minutes: 120
            cool_at: 78
            cool_stop: 74
            max_rh: 70
            burst_minutes: 30
            recovery_minutes: 15
            feedback_timeout: 60
            stable_seconds: 8
            off_seconds: 15
            off_below: 10
            range_tolerance: 0.5
            boot_state: "cool_low"
            ranges:
              cool_low:
                - 46
                - 47
              cool_med:
                - 48
                - 50
              cool_high:
                - 50
                - 53
              exhaust_low:
                - 32
                - 33
              exhaust_med:
                - 34
                - 35
              exhaust_high:
                - 35
                - 38
              circulate_low:
                - 39
                - 40
              circulate_med:
                - 42
                - 43
              circulate_high:
                - 44
                - 46
            press_delay: 1.5
      - variables:
          event: "{{ event | default('evaluate') }}"
          requested: "{{ target_function | default('') }}"
          requested_speed: "{{ target_speed | default('') }}"
          now_ts: "{{ now().timestamp() }}"
          boot_recovered: "{{ false }}"
      - if:
          - condition: "template"
            value_template: "{{ event == 'manual' and (requested not in ['', 'cool','exhaust','circulate'] or requested_speed not in ['', 'low','med','high'] or (requested == '' and requested_speed == '')) }}"
        then:
          - stop: "Invalid manual request."
      - if:
          - condition: "template"
            value_template: "{{ event in ['manual','synchronize'] }}"
        then:
          - action: "input_datetime.set_datetime"
            target:
              entity_id: "input_datetime.den_fan_manual_until"
            data:
              timestamp: "{{ now_ts + cfg.manual_minutes * 60 }}"
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_cycle"
            data:
              option: "normal"
          - action: "input_datetime.set_datetime"
            target:
              entity_id: "input_datetime.den_fan_cycle_end"
            data:
              timestamp: "{{ now_ts }}"
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.den_fan_reason"
            data:
              value: "Manual hold"
      - if:
          - condition: "template"
            value_template: "{{ event == 'resume_auto' }}"
        then:
          - action: "input_datetime.set_datetime"
            target:
              entity_id: "input_datetime.den_fan_manual_until"
            data:
              timestamp: "{{ now_ts }}"
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_cycle"
            data:
              option: "normal"
          - action: "input_datetime.set_datetime"
            target:
              entity_id: "input_datetime.den_fan_cycle_end"
            data:
              timestamp: "{{ now_ts }}"
      - if:
          - condition: "template"
            value_template: "{{ event == 'startup' }}"
        then:
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_confirmed_state"
            data:
              option: "unknown"
      - variables:
          known: "{{ states('input_select.den_fan_confirmed_state') }}"
          seen: "{{ states('sensor.den_fan_power_candidates').split('|') }}"
          stable: "{{ now().timestamp() - as_timestamp(states['sensor.den_fan_power_candidates'].last_changed, 0) >= cfg.stable_seconds }}"
          was_blocked: "{{ is_state('input_boolean.den_fan_command_fault','on') }}"
      - if:
          - condition: "template"
            value_template: "{{ seen == ['off'] }}"
        then:
          - if:
              - condition: "template"
                value_template: "{{ now_ts - as_timestamp(states['sensor.den_fan_power_candidates'].last_changed,0) >= cfg.off_seconds }}"
            then:
              - action: "input_boolean.turn_on"
                target:
                  entity_id: "input_boolean.den_fan_boot_pending"
              - action: "input_select.select_option"
                target:
                  entity_id: "input_select.den_fan_confirmed_state"
                data:
                  option: "off"
              - action: "script.den_fan_apply_state"
                data:
                  operation: "power_on"
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.den_fan_reason"
            data:
              value: "Fan off; waiting for startup at Cool/Low"
          - stop: "Waiting for fan startup."
      - if:
          - condition: "template"
            value_template: "{{ is_state('input_boolean.den_fan_boot_pending','on') }}"
        then:
          - if:
              - condition: "template"
                value_template: "{{ stable and (is_number(states(cfg.power)) and cfg.boot_state in cfg.ranges and cfg.ranges[cfg.boot_state][0] - cfg.range_tolerance <= states(cfg.power) | float <= cfg.ranges[cfg.boot_state][1] + cfg.range_tolerance) }}"
            then:
              - action: "input_select.select_option"
                target:
                  entity_id: "input_select.den_fan_confirmed_state"
                data:
                  option: "{{ cfg.boot_state }}"
              - action: "input_boolean.turn_off"
                target:
                  entity_id: "input_boolean.den_fan_boot_pending"
              - action: "input_boolean.turn_off"
                target:
                  entity_id: "input_boolean.den_fan_command_fault"
              - action: "input_text.set_value"
                target:
                  entity_id: "input_text.den_fan_error"
                data:
                  value: ""
              - variables:
                  known: "{{ cfg.boot_state }}"
                  was_blocked: "{{ false }}"
                  boot_recovered: "{{ true }}"
            else:
              - stop: "Waiting for measured startup at Cool/Low."
      - if:
          - condition: "template"
            value_template: "{{ event == 'synchronize' }}"
        then:
          - variables:
              chosen: "{{ requested ~ '_' ~ requested_speed }}"
          - if:
              - condition: "template"
                value_template: "{{ not (is_number(states(cfg.power)) and chosen in cfg.ranges and cfg.ranges[chosen][0] - cfg.range_tolerance <= states(cfg.power) | float <= cfg.ranges[chosen][1] + cfg.range_tolerance) }}"
            then:
              - action: "input_text.set_value"
                target:
                  entity_id: "input_text.den_fan_error"
                data:
                  value: "Physical selection does not match the measured range."
              - stop: "Synchronization rejected."
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_confirmed_state"
            data:
              option: "{{ chosen }}"
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_manual_mode"
            data:
              option: "{{ requested }}"
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_manual_speed"
            data:
              option: "{{ requested_speed }}"
          - action: "input_boolean.turn_off"
            target:
              entity_id: "input_boolean.den_fan_command_fault"
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.den_fan_error"
            data:
              value: ""
          - stop: "Physical setting confirmed; manual hold active. No remote commands sent."
      - if:
          - condition: "template"
            value_template: "{{ not (is_number(states(cfg.power)) and known in cfg.ranges and cfg.ranges[known][0] - cfg.range_tolerance <= states(cfg.power) | float <= cfg.ranges[known][1] + cfg.range_tolerance) }}"
        then:
          - if:
              - condition: "template"
                value_template: "{{ stable and seen | length == 1 and seen[0] in cfg.ranges }}"
            then:
              - action: "input_select.select_option"
                target:
                  entity_id: "input_select.den_fan_confirmed_state"
                data:
                  option: "{{ seen[0] }}"
              - if:
                  - condition: "template"
                    value_template: "{{ known in cfg.ranges and not was_blocked and now_ts > (state_attr('input_datetime.den_fan_command_guard_until', 'timestamp') | float(0)) and event not in ['manual','resume_auto','startup'] }}"
                then:
                  - action: "input_select.select_option"
                    target:
                      entity_id: "input_select.den_fan_manual_mode"
                    data:
                      option: "{{ seen[0].split('_')[0] }}"
                  - action: "input_select.select_option"
                    target:
                      entity_id: "input_select.den_fan_manual_speed"
                    data:
                      option: "{{ seen[0].split('_')[1] }}"
                  - action: "input_datetime.set_datetime"
                    target:
                      entity_id: "input_datetime.den_fan_manual_until"
                    data:
                      timestamp: "{{ now_ts + cfg.manual_minutes*60 }}"
                  - action: "input_select.select_option"
                    target:
                      entity_id: "input_select.den_fan_cycle"
                    data:
                      option: "normal"
                  - action: "input_datetime.set_datetime"
                    target:
                      entity_id: "input_datetime.den_fan_cycle_end"
                    data:
                      timestamp: "{{ now_ts }}"
                  - action: "input_text.set_value"
                    target:
                      entity_id: "input_text.den_fan_reason"
                    data:
                      value: "Manual hold: external fan change"
              - variables:
                  known: "{{ seen[0] }}"
            else:
              - action: "input_text.set_value"
                target:
                  entity_id: "input_text.den_fan_error"
                data:
                  value: "Fan state uncertain. Wait for a distinct reading or confirm the physical setting."
              - stop: "No toggle commands sent."
      - if:
          - condition: "template"
            value_template: "{{ event in ['manual','resume_auto'] }}"
        then:
          - action: "input_boolean.turn_off"
            target:
              entity_id: "input_boolean.den_fan_command_fault"
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.den_fan_error"
            data:
              value: ""
      - if:
          - condition: "template"
            value_template: "{{ is_state('input_boolean.den_fan_command_fault','on') }}"
        then:
          - stop: "Previous command failed. Automatic retries remain paused."
      - if:
          - condition: "template"
            value_template: "{{ event == 'manual' or (boot_recovered and (state_attr('input_datetime.den_fan_manual_until', 'timestamp') | float(0)) > now_ts) }}"
        then:
          - if:
              - condition: "template"
                value_template: "{{ event == 'manual' }}"
            then:
              - action: "input_select.select_option"
                target:
                  entity_id: "input_select.den_fan_manual_mode"
                data:
                  option: "{{ requested if requested else known.split('_')[0] }}"
              - action: "input_select.select_option"
                target:
                  entity_id: "input_select.den_fan_manual_speed"
                data:
                  option: "{{ requested_speed if requested_speed else known.split('_')[1] }}"
          - variables:
              desired_mode: "{{ states('input_select.den_fan_manual_mode') }}"
              desired_speed: "{{ states('input_select.den_fan_manual_speed') }}"
        else:
          - if:
              - condition: "template"
                value_template: "{{ (state_attr('input_datetime.den_fan_manual_until', 'timestamp') | float(0)) > now_ts }}"
            then:
              - stop: "Manual hold: automatic output suspended."
          - if:
              - condition: "template"
                value_template: "{{ event == 'observe' and not boot_recovered }}"
            then:
              - stop: "Observed state updated; climate evaluation runs once per minute."
          - variables:
              temp: "{% set n=states(cfg.temperature) %}{{ (n | float * 9/5+32 if state_attr(cfg.temperature,'unit_of_measurement') == '°C' else n | float) if is_number(n) else none }}"
              rh: "{{ states(cfg.humidity) | float(none) }}"
              cycle: "{{ states('input_select.den_fan_cycle') }}"
              cycle_end: "{{ (state_attr('input_datetime.den_fan_cycle_end', 'timestamp') | float(0)) }}"
          - if:
              - condition: "template"
                value_template: "{{ temp is none or rh is none or not (-100 < temp < 150 and 0 <= rh <= 100) }}"
            then:
              - action: "input_text.set_value"
                target:
                  entity_id: "input_text.den_fan_reason"
                data:
                  value: "Climate unavailable; keeping current fan setting"
              - stop: "No climate decision with invalid data."
          - variables:
              plan: >-
                {% set p=namespace(mode='exhaust',cycle=cycle,end=cycle_end,reason='Exhaust: continuous ventilation') %}
                {% if p.cycle in ['burst','extended'] %}
                  {% if temp <= cfg.cool_stop or (p.cycle == 'extended' and rh > cfg.max_rh) %}
                    {% set p.cycle='recovery' %}{% set p.end=now_ts+cfg.recovery_minutes*60 %}
                  {% elif now_ts >= p.end %}
                    {% if rh <= cfg.max_rh %}{% set p.cycle='extended' %}{% set p.end=now_ts+cfg.burst_minutes*60 %}
                    {% else %}{% set p.cycle='recovery' %}{% set p.end=now_ts+cfg.recovery_minutes*60 %}{% endif %}
                  {% endif %}
                {% endif %}
                {% if p.cycle == 'recovery' and now_ts >= p.end %}{% set p.cycle='normal' %}{% set p.end=0 %}{% endif %}
                {% if p.cycle in ['burst','extended'] %}{% set p.mode='cool' %}{% set p.reason='Cooling: heat relief' %}
                {% elif p.cycle == 'recovery' %}{% set p.reason='Exhaust: recovery interval' %}
                {% elif temp >= cfg.cool_at %}{% set p.mode='cool' %}{% set p.cycle='burst' %}{% set p.end=now_ts+cfg.burst_minutes*60 %}{% set p.reason='Cooling: room at temperature limit' %}
                {% endif %}
                {{ dict(mode=p.mode,cycle=p.cycle,end=p.end,reason=p.reason) }}
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_cycle"
            data:
              option: "{{ plan.cycle }}"
          - action: "input_datetime.set_datetime"
            target:
              entity_id: "input_datetime.den_fan_cycle_end"
            data:
              timestamp: "{{ plan.end }}"
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.den_fan_reason"
            data:
              value: "{{ plan.reason }}"
          - variables:
              desired_mode: "{{ plan.mode }}"
              desired_speed: "high"
      - action: "input_select.select_option"
        target:
          entity_id: "input_select.den_fan_requested_mode"
        data:
          option: "{{ desired_mode }}"
      - action: "input_select.select_option"
        target:
          entity_id: "input_select.den_fan_requested_speed"
        data:
          option: "{{ desired_speed }}"
      - if:
          - condition: "template"
            value_template: "{{ known == desired_mode ~ '_' ~ desired_speed }}"
        then:
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.den_fan_error"
            data:
              value: ""
          - stop: "Requested setting already confirmed; no hardware actions."
      - action: "input_boolean.turn_on"
        target:
          entity_id: "input_boolean.den_fan_command_fault"
      - action: "input_text.set_value"
        target:
          entity_id: "input_text.den_fan_error"
        data:
          value: "Command in progress; if interrupted, confirm the fan setting before retrying."
      - action: "script.den_fan_apply_state"
        data:
          target_function: "{{ desired_mode }}"
          target_speed: "{{ desired_speed }}"
  den_fan_apply_state:
    alias: "Den Fan - Apply Confirmed State"
    mode: "single"
    trace:
      stored_traces: 20
    fields:
      target_function:
        selector:
          select:
            options:
              - "cool"
              - "exhaust"
              - "circulate"
      target_speed:
        selector:
          select:
            options:
              - "low"
              - "med"
              - "high"
    sequence:
      - variables:
          cfg:
            power: "sensor.den_fan_power"
            plug: "switch.den_fan_plug"
            remote: "remote.den_fan_remote"
            device: "Den Fan"
            mode_command: "mode_toggle"
            speed_command: "speed_toggle"
            power_command: ""
            temperature: "sensor.den_temperature"
            humidity: "sensor.den_humidity"
            manual_minutes: 120
            cool_at: 78
            cool_stop: 74
            max_rh: 70
            burst_minutes: 30
            recovery_minutes: 15
            feedback_timeout: 60
            stable_seconds: 8
            off_seconds: 15
            off_below: 10
            range_tolerance: 0.5
            boot_state: "cool_low"
            ranges:
              cool_low:
                - 46
                - 47
              cool_med:
                - 48
                - 50
              cool_high:
                - 50
                - 53
              exhaust_low:
                - 32
                - 33
              exhaust_med:
                - 34
                - 35
              exhaust_high:
                - 35
                - 38
              circulate_low:
                - 39
                - 40
              circulate_med:
                - 42
                - 43
              circulate_high:
                - 44
                - 46
            press_delay: 1.5
      - if:
          - condition: "template"
            value_template: "{{ operation | default('apply') == 'power_on' }}"
        then:
          - if:
              - condition: "template"
                value_template: "{{ states('sensor.den_fan_power_candidates') == 'off' and now().timestamp() - as_timestamp(states['sensor.den_fan_power_candidates'].last_changed,0) >= cfg.off_seconds }}"
            then:
              - if:
                  - condition: "template"
                    value_template: "{{ is_state(cfg.plug,'off') }}"
                then:
                  - action: "switch.turn_on"
                    target:
                      entity_id: "switch.den_fan_plug"
                else:
                  - if:
                      - condition: "template"
                        value_template: "{{ cfg.power_command != '' }}"
                    then:
                      - action: "remote.send_command"
                        target:
                          entity_id: "remote.den_fan_remote"
                        data:
                          device: "Den Fan"
                          command: "{{ cfg.power_command }}"
          - stop: "Power-on recovery requested; waiting for the startup reference."
      - variables:
          target: "{{ target_function ~ '_' ~ target_speed }}"
      - if:
          - condition: "template"
            value_template: "{{ target not in cfg.ranges }}"
        then:
