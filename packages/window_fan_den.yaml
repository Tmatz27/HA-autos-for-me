# Den fan 1.7.0 - GENERIC EXAMPLE, configure privately before installing.
input_boolean:
  den_fan_command_fault:
    name: "Den Fan Command Fault"
  den_fan_command_in_progress:
    name: "Den Fan Command In Progress"
  den_fan_running:
    name: "Den Fan Believed Running"
  den_fan_auto_recovery_used:
    name: "Den Fan Automatic Recovery Used"
input_select:
  den_fan_confirmed_state:
    name: "Den Fan Expected State"
    options:
      - "unknown"
      - "off"
      - "cool_low"
      - "cool_med"
      - "cool_high"
      - "exhaust_low"
      - "exhaust_med"
      - "exhaust_high"
      - "circulate_low"
      - "circulate_med"
      - "circulate_high"
  den_fan_confidence:
    name: "Den Fan Confidence"
    options:
      - "uncertain"
      - "inferred"
      - "established"
  den_fan_recovery:
    name: "Den Fan Recovery"
    options:
      - "idle"
      - "in_progress"
      - "complete"
      - "failed"
  den_fan_cycle:
    name: "Den Fan Cycle"
    options:
      - "normal"
      - "burst"
      - "extended"
      - "recovery"
      - "cooling"
      - "heat_relief"
  den_fan_requested_mode:
    name: "Den Fan Requested Mode"
    options:
      - "cool"
      - "exhaust"
      - "circulate"
  den_fan_requested_speed:
    name: "Den Fan Requested Speed"
    options:
      - "low"
      - "med"
      - "high"
  den_fan_manual_mode:
    name: "Den Fan Manual Mode"
    options:
      - "cool"
      - "exhaust"
      - "circulate"
  den_fan_manual_speed:
    name: "Den Fan Manual Speed"
    options:
      - "low"
      - "med"
      - "high"
input_datetime:
  den_fan_manual_until:
    name: "Den Fan Manual Until"
    has_date: true
    has_time: true
  den_fan_cycle_end:
    name: "Den Fan Cycle End"
    has_date: true
    has_time: true
  den_fan_last_command_time:
    name: "Den Fan Last Command Time"
    has_date: true
    has_time: true
input_text:
  den_fan_reason:
    name: "Den Fan Reason"
    max: 255
  den_fan_error:
    name: "Den Fan Error"
    max: 255
  den_fan_outcome:
    name: "Den Fan Outcome"
    max: 255
template:
  - sensor:
      - name: "Den Fan Humidity Sample"
        unique_id: "den_fan_humidity_sample"
        device_class: "humidity"
        unit_of_measurement: "%"
        availability: "{{ is_number(states('sensor.example_humidity')) and 0 <= states('sensor.example_humidity')|float <= 100 }}"
        state: "{{ states('sensor.example_humidity')|float(none) }}"
        attributes:
          sampled_at: "{{ now().isoformat() }}"
      - name: "Den Fan Power Candidates"
        unique_id: "den_fan_power_candidates"
        state: "{% set p=states('sensor.example_fan_power') %}{% if not is_number(p) or p|float < 0 %}unknown{% elif p|float < 10 %}off{% else %}{% set ranges={\"cool_low\": [46, 47], \"cool_med\": [48, 50], \"cool_high\": [50, 53], \"exhaust_low\": [32, 33], \"exhaust_med\": [34, 35], \"exhaust_high\": [35, 38], \"circulate_low\": [39, 40], \"circulate_med\": [42, 43], \"circulate_high\": [44, 46]} %}{% set ns=namespace(matches=[]) %}{% for name,b in ranges.items() %}{% if b[0]-0.5 <= p|float <= b[1]+0.5 %}{% set ns.matches=ns.matches+[name] %}{% endif %}{% endfor %}{{ ns.matches|join('|') if ns.matches else 'unknown' }}{% endif %}"
      - name: "Den Fan State"
        unique_id: "den_fan_state"
        icon: "mdi:fan"
        state: "{{ states('input_select.den_fan_confirmed_state') }}"
        attributes:
          power_sensor: "sensor.example_fan_power"
          calibration_prefix: "den_fan"
          manual_control: "{{ true }}"
          controller_script: "script.den_fan_set_state"
          status_sensor: "sensor.den_fan_control_status"
          temperature_sensor: "sensor.example_temperature"
          humidity_sensor: "sensor.example_humidity"
          controller_version: "1.7.0"
          confidence: "{{ 'uncertain' if is_state('input_boolean.den_fan_command_in_progress','on') and not is_state('script.den_fan_executor','on') else states('input_select.den_fan_confidence') }}"
      - name: "Den Fan Control Status"
        unique_id: "den_fan_control_status"
        icon: "mdi:fan-auto"
        state: "{{ 'Applying setting' if is_state('script.den_fan_executor','on') else 'Manual hold' if (state_attr('input_datetime.den_fan_manual_until', 'timestamp') | float(0)) > now().timestamp() else 'Auto paused: recovery required' if is_state('input_boolean.den_fan_command_fault','on') or is_state('input_boolean.den_fan_command_in_progress','on') and not is_state('script.den_fan_executor','on') else states('input_text.den_fan_reason') }}"
        attributes:
          manual_until_timestamp: "{{ (state_attr('input_datetime.den_fan_manual_until', 'timestamp') | float(0)) }}"
          manual_active: "{{ (state_attr('input_datetime.den_fan_manual_until', 'timestamp') | float(0)) > now().timestamp() }}"
          command_active: "{{ is_state('script.den_fan_executor','on') }}"
          blocked: "{{ is_state('input_boolean.den_fan_command_fault','on') or is_state('input_boolean.den_fan_command_in_progress','on') and not is_state('script.den_fan_executor','on') }}"
          error: "{{ 'Command interrupted or service failed. Confirm physical state or Recover. Last step: ' ~ states('input_text.den_fan_error') if is_state('input_boolean.den_fan_command_in_progress','on') and not is_state('script.den_fan_executor','on') else states('input_text.den_fan_error') }}"
          confidence: "{{ 'uncertain' if is_state('input_boolean.den_fan_command_in_progress','on') and not is_state('script.den_fan_executor','on') else states('input_select.den_fan_confidence') }}"
          expected_state: "{{ states('input_select.den_fan_confirmed_state') }}"
          running: "{{ is_state('input_boolean.den_fan_running','on') }}"
          evidence: "{% set cfg={'power': 'sensor.example_fan_power', 'plug': 'switch.example_fan_plug', 'remote': 'remote.example_remote', 'device': 'EXAMPLE_FAN', 'mode_command': 'EXAMPLE_MODE', 'speed_command': 'EXAMPLE_SPEED', 'power_on_command': 'EXAMPLE_ON', 'power_off_command': 'EXAMPLE_OFF', 'temperature': 'sensor.example_temperature', 'humidity': 'sensor.example_humidity', 'manual_minutes': 120, 'cool_at': 70, 'cool_stop': 68, 'max_rh': 65, 'heat_at': 78, 'heat_stop': 75, 'burst_minutes': 30, 'recovery_minutes': 10, 'rapid_rise_points': 8, 'off_seconds': 15, 'plug_delay': 3, 'startup_delay': 8, 'command_delay': 3, 'feedback_timeout': 30, 'power_stale_seconds': 120, 'off_below': 10, 'range_tolerance': 0.5, 'auto_recovery': False, 'ranges': {'cool_low': [46, 47], 'cool_med': [48, 50], 'cool_high': [50, 53], 'exhaust_low': [32, 33], 'exhaust_med': [34, 35], 'exhaust_high': [35, 38], 'circulate_low': [39, 40], 'circulate_med': [42, 43], 'circulate_high': [44, 46]}, 'led_device': '', 'led_on_command': 'on', 'led_off_command': 'off'} %}{% set expected=states('input_select.den_fan_confirmed_state') %}{% if not (is_number(states(cfg.power)) and states(cfg.power)|float >= 0 and now().timestamp()-as_timestamp(states[cfg.power].last_reported,0) <= cfg.power_stale_seconds) %}Power unavailable or stale; command history retained{% elif states(cfg.power)|float < cfg.off_below %}Fan appears stopped; recover or confirm physical state{% elif not (expected in cfg.ranges and cfg.ranges[expected][0]-cfg.range_tolerance <= states(cfg.power)|float <= cfg.ranges[expected][1]+cfg.range_tolerance) %}Power conflicts with expected setting; inspect fan or recover{% elif '|' in states('sensor.den_fan_power_candidates') %}Overlapping power bands; expected setting retained{% else %}Power corroborates expected setting; IR delivery is not independently proven{% endif %}"
          last_outcome: "{{ states('input_text.den_fan_outcome') }}"
          recovery: "{{ 'failed' if is_state('input_boolean.den_fan_command_in_progress','on') and not is_state('script.den_fan_executor','on') and is_state('input_select.den_fan_recovery','in_progress') else states('input_select.den_fan_recovery') }}"
          requested_mode: "{{ states('input_select.den_fan_requested_mode') }}"
          requested_speed: "{{ states('input_select.den_fan_requested_speed') }}"
          cycle: "{{ states('input_select.den_fan_cycle') }}"
          cycle_end_timestamp: "{{ (state_attr('input_datetime.den_fan_cycle_end', 'timestamp') | float(0)) }}"
          humidity_restart_limit: "{% set n=states('sensor.example_temperature') %}\n{% if is_number(n) %}\n{% set temp=n | float * 9/5+32 if state_attr('sensor.example_temperature','unit_of_measurement') == '°C' else n | float %}\n{{ (58 if temp <= 72 else 58+(temp-72) if temp <= 76 else 62+(temp-76)*1.5 if temp < 78 else 65) | round(1) }}\n{% else %}{{ none }}{% endif %}"
          humidity_rise_10m: "{{ states('sensor.example_humidity')|float - states('sensor.den_fan_humidity_min_10m')|float if is_number(states('sensor.example_humidity')) and is_number(states('sensor.den_fan_humidity_min_10m')) else none }}"
          controller_version: "1.7.0"
sensor:
  - platform: "statistics"
    name: "Den Fan Humidity Min 10m"
    unique_id: "den_fan_humidity_min_10m"
    entity_id: "sensor.den_fan_humidity_sample"
    state_characteristic: "value_min"
    max_age:
      minutes: 10
    sampling_size: 600
script:
  den_fan_set_state:
    alias: "Den Fan - Request"
    mode: "parallel"
    max: 20
    fields:
      event:
        selector:
          select:
            options:
              - "evaluate"
              - "observe"
              - "startup"
              - "power_lost"
              - "manual"
              - "resume_auto"
              - "recover"
              - "synchronize"
              - "led_on"
              - "led_off"
      target_function:
        selector:
          select:
            options:
              - "cool"
              - "exhaust"
              - "circulate"
      target_speed:
        selector:
          select:
            options:
              - "low"
              - "med"
              - "high"
    sequence:
      - variables:
          cfg:
            power: "sensor.example_fan_power"
            plug: "switch.example_fan_plug"
            remote: "remote.example_remote"
            device: "EXAMPLE_FAN"
            mode_command: "EXAMPLE_MODE"
            speed_command: "EXAMPLE_SPEED"
            power_on_command: "EXAMPLE_ON"
            power_off_command: "EXAMPLE_OFF"
            temperature: "sensor.example_temperature"
            humidity: "sensor.example_humidity"
            manual_minutes: 120
            cool_at: 70
            cool_stop: 68
            max_rh: 65
            heat_at: 78
            heat_stop: 75
            burst_minutes: 30
            recovery_minutes: 10
            rapid_rise_points: 8
            off_seconds: 15
            plug_delay: 3
            startup_delay: 8
            command_delay: 3
            feedback_timeout: 30
            power_stale_seconds: 120
            off_below: 10
            range_tolerance: 0.5
            auto_recovery: false
            ranges:
              cool_low:
                - 46
                - 47
              cool_med:
                - 48
                - 50
              cool_high:
                - 50
                - 53
              exhaust_low:
                - 32
                - 33
              exhaust_med:
                - 34
                - 35
              exhaust_high:
                - 35
                - 38
              circulate_low:
                - 39
                - 40
              circulate_med:
                - 42
                - 43
              circulate_high:
                - 44
                - 46
            led_device: ""
            led_on_command: "on"
            led_off_command: "off"
      - variables:
          event: "{{ event|default('evaluate') }}"
          requested: "{{ target_function|default('') }}"
          requested_speed: "{{ target_speed|default('') }}"
      - if:
          - condition: "template"
            value_template: "{{ event not in ['evaluate', 'observe', 'startup', 'power_lost', 'manual', 'resume_auto', 'recover', 'synchronize', 'led_on', 'led_off'] }}"
        then:
          - stop: "Invalid event."
      - if:
          - condition: "template"
            value_template: "{{ requested not in ['', 'cool','exhaust','circulate'] or requested_speed not in ['', 'low','med','high'] }}"
        then:
          - stop: "Invalid setting."
      - if:
          - condition: "template"
            value_template: "{{ event == 'manual' and requested == '' and requested_speed == '' }}"
        then:
          - stop: "Select a mode or speed."
      - if:
          - condition: "template"
            value_template: "{{ event == 'synchronize' and (requested == '' or requested_speed == '') }}"
        then:
          - stop: "Select both physical axes."
      - if:
          - condition: "template"
            value_template: "{{ event in ['manual','synchronize','recover'] }}"
        then:
          - action: "input_datetime.set_datetime"
            target:
              entity_id: "input_datetime.den_fan_manual_until"
            data:
              timestamp: "{{ now().timestamp()+cfg.manual_minutes*60 }}"
      - action: "script.den_fan_executor"
        data:
          event: "{{ event }}"
          target_function: "{{ requested }}"
          target_speed: "{{ requested_speed }}"
        continue_on_error: true
  den_fan_executor:
    alias: "Den Fan - Serialized Hardware Executor"
    mode: "queued"
    max: 20
    trace:
      stored_traces: 20
    fields:
      event:
        selector:
          select:
            options:
              - "evaluate"
              - "observe"
              - "startup"
              - "power_lost"
              - "manual"
              - "resume_auto"
              - "recover"
              - "synchronize"
              - "led_on"
              - "led_off"
      target_function:
        selector:
          select:
            options:
              - "cool"
              - "exhaust"
              - "circulate"
      target_speed:
        selector:
          select:
            options:
              - "low"
              - "med"
              - "high"
    sequence:
      - variables:
          cfg:
            power: "sensor.example_fan_power"
            plug: "switch.example_fan_plug"
            remote: "remote.example_remote"
            device: "EXAMPLE_FAN"
            mode_command: "EXAMPLE_MODE"
            speed_command: "EXAMPLE_SPEED"
            power_on_command: "EXAMPLE_ON"
            power_off_command: "EXAMPLE_OFF"
            temperature: "sensor.example_temperature"
            humidity: "sensor.example_humidity"
            manual_minutes: 120
            cool_at: 70
            cool_stop: 68
            max_rh: 65
            heat_at: 78
            heat_stop: 75
            burst_minutes: 30
            recovery_minutes: 10
            rapid_rise_points: 8
            off_seconds: 15
            plug_delay: 3
            startup_delay: 8
            command_delay: 3
            feedback_timeout: 30
            power_stale_seconds: 120
            off_below: 10
            range_tolerance: 0.5
            auto_recovery: false
            ranges:
              cool_low:
                - 46
                - 47
              cool_med:
                - 48
                - 50
              cool_high:
                - 50
                - 53
              exhaust_low:
                - 32
                - 33
              exhaust_med:
                - 34
                - 35
              exhaust_high:
                - 35
                - 38
              circulate_low:
                - 39
                - 40
              circulate_med:
                - 42
                - 43
              circulate_high:
                - 44
                - 46
            led_device: ""
            led_on_command: "on"
            led_off_command: "off"
      - variables:
          event: "{{ event|default('evaluate') }}"
          requested: "{{ target_function|default('') }}"
          requested_speed: "{{ target_speed|default('') }}"
          now_ts: "{{ now().timestamp() }}"
      - if:
          - condition: "template"
            value_template: "{{ event in ['led_on','led_off'] }}"
        then:
          - if:
              - condition: "template"
                value_template: "{{ cfg.led_device == '' }}"
            then:
              - stop: "LED control is not configured."
          - action: "remote.send_command"
            target:
              entity_id: "remote.example_remote"
            data:
              device: ""
              command: "{{ cfg.led_on_command if event == 'led_on' else cfg.led_off_command }}"
              num_repeats: 1
          - delay:
              seconds: 3
          - stop: "Room LED command sent; physical receipt is not confirmed."
      - if:
          - condition: "template"
            value_template: "{{ is_state('input_boolean.den_fan_command_in_progress','on') }}"
        then:
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_confidence"
            data:
              option: "uncertain"
          - action: "input_boolean.turn_on"
            target:
              entity_id: "input_boolean.den_fan_command_fault"
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.den_fan_error"
            data:
              value: "Previous command interrupted or failed. Confirm physical state or Recover."
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.den_fan_outcome"
            data:
              value: "Previous sequence incomplete"
          - action: "input_boolean.turn_off"
            target:
              entity_id: "input_boolean.den_fan_command_in_progress"
          - if:
              - condition: "template"
                value_template: "{{ is_state('input_select.den_fan_recovery','in_progress') }}"
            then:
              - action: "input_select.select_option"
                target:
                  entity_id: "input_select.den_fan_recovery"
                data:
                  option: "failed"
      - if:
          - condition: "template"
            value_template: "{{ event == 'startup' }}"
        then:
          - if:
              - condition: "template"
                value_template: "{{ states('input_select.den_fan_confirmed_state') in ['cool_low', 'cool_med', 'cool_high', 'exhaust_low', 'exhaust_med', 'exhaust_high', 'circulate_low', 'circulate_med', 'circulate_high'] and not is_state('input_boolean.den_fan_command_fault','on') }}"
            then:
              - action: "input_select.select_option"
                target:
                  entity_id: "input_select.den_fan_confidence"
                data:
                  option: "inferred"
      - if:
          - condition: "template"
            value_template: "{{ event == 'synchronize' }}"
        then:
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_confirmed_state"
            data:
              option: "{{ requested ~ '_' ~ requested_speed }}"
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_confidence"
            data:
              option: "established"
          - action: "input_boolean.turn_on"
            target:
              entity_id: "input_boolean.den_fan_running"
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_manual_mode"
            data:
              option: "{{ requested }}"
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_manual_speed"
            data:
              option: "{{ requested_speed }}"
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_requested_mode"
            data:
              option: "{{ requested }}"
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_requested_speed"
            data:
              option: "{{ requested_speed }}"
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_cycle"
            data:
              option: "normal"
          - action: "input_datetime.set_datetime"
            target:
              entity_id: "input_datetime.den_fan_cycle_end"
            data:
              timestamp: "{{ now_ts }}"
          - action: "input_boolean.turn_off"
            target:
              entity_id: "input_boolean.den_fan_command_fault"
          - action: "input_boolean.turn_off"
            target:
              entity_id: "input_boolean.den_fan_auto_recovery_used"
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_recovery"
            data:
              option: "idle"
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.den_fan_reason"
            data:
              value: "Manual hold: physical setting confirmed"
          - variables:
              expected: "{{ requested ~ '_' ~ requested_speed }}"
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.den_fan_error"
            data:
              value: "{{ 'Physical setting accepted; wattage disagrees or is unavailable. Check evidence before the next change.' if not ((is_number(states(cfg.power)) and states(cfg.power)|float >= 0 and now().timestamp()-as_timestamp(states[cfg.power].last_reported,0) <= cfg.power_stale_seconds) and (expected in cfg.ranges and cfg.ranges[expected][0]-cfg.range_tolerance <= states(cfg.power)|float <= cfg.ranges[expected][1]+cfg.range_tolerance)) else '' }}"
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.den_fan_outcome"
            data:
              value: "Physical setting accepted without IR commands"
          - stop: "Physical state confirmed."
      - if:
          - condition: "template"
            value_template: "{{ event == 'power_lost' and is_state(cfg.plug,'on') }}"
        then:
          - stop: "Old plug-off event; power already restored."
      - if:
          - condition: "template"
            value_template: "{{ event == 'resume_auto' }}"
        then:
          - action: "input_datetime.set_datetime"
            target:
              entity_id: "input_datetime.den_fan_manual_until"
            data:
              timestamp: "{{ now_ts }}"
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_cycle"
            data:
              option: "normal"
          - action: "input_datetime.set_datetime"
            target:
              entity_id: "input_datetime.den_fan_cycle_end"
            data:
              timestamp: "{{ now_ts }}"
      - if:
          - condition: "template"
            value_template: "{{ not is_state(cfg.plug,'on') or ((is_number(states(cfg.power)) and states(cfg.power)|float >= 0 and now().timestamp()-as_timestamp(states[cfg.power].last_reported,0) <= cfg.power_stale_seconds) and states(cfg.power)|float < cfg.off_below) }}"
        then:
          - action: "input_boolean.turn_off"
            target:
              entity_id: "input_boolean.den_fan_running"
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_confidence"
            data:
              option: "uncertain"
          - action: "input_boolean.turn_on"
            target:
              entity_id: "input_boolean.den_fan_command_fault"
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.den_fan_error"
            data:
              value: "Fan power lost or fan stopped. Recover / Reinitialize before further toggles."
      - if:
          - condition: "template"
            value_template: "{{ event not in ['manual','recover','synchronize'] and (state_attr('input_datetime.den_fan_manual_until', 'timestamp') | float(0)) > now().timestamp() }}"
        then:
          - action: "input_boolean.turn_off"
            target:
              entity_id: "input_boolean.den_fan_command_in_progress"
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.den_fan_error"
            data:
              value: ""
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.den_fan_outcome"
            data:
              value: "Auto yielded to manual request"
          - stop: "Manual request takes priority."
      - variables:
          known: "{{ states('input_select.den_fan_confirmed_state') }}"
      - if:
          - condition: "template"
            value_template: "{{ event == 'manual' }}"
        then:
          - if:
              - condition: "template"
                value_template: "{{ known not in cfg.ranges and (requested == '' or requested_speed == '') }}"
            then:
              - action: "input_select.select_option"
                target:
                  entity_id: "input_select.den_fan_confidence"
                data:
                  option: "uncertain"
              - action: "input_boolean.turn_on"
                target:
                  entity_id: "input_boolean.den_fan_command_fault"
              - action: "input_text.set_value"
                target:
                  entity_id: "input_text.den_fan_error"
                data:
                  value: "Unknown starting state. Confirm both axes or Recover before a one-axis request."
              - action: "input_text.set_value"
                target:
                  entity_id: "input_text.den_fan_outcome"
                data:
                  value: "Stopped safely; physical reference required"
              - if:
                  - condition: "template"
                    value_template: "{{ is_state('input_select.den_fan_recovery','in_progress') }}"
                then:
                  - action: "input_select.select_option"
                    target:
                      entity_id: "input_select.den_fan_recovery"
                    data:
                      option: "failed"
              - action: "input_boolean.turn_off"
                target:
                  entity_id: "input_boolean.den_fan_command_in_progress"
              - stop: "Unknown starting state. Confirm both axes or Recover before a one-axis request."
          - variables:
              desired_mode: "{{ requested if requested else known.split('_')[0] }}"
              desired_speed: "{{ requested_speed if requested_speed else known.split('_')[1] }}"
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_manual_mode"
            data:
              option: "{{ desired_mode }}"
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_manual_speed"
            data:
              option: "{{ desired_speed }}"
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_cycle"
            data:
              option: "normal"
          - action: "input_datetime.set_datetime"
            target:
              entity_id: "input_datetime.den_fan_cycle_end"
            data:
              timestamp: "{{ now_ts }}"
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.den_fan_reason"
            data:
              value: "Manual hold"
        else:
          - if:
              - condition: "template"
                value_template: "{{ (state_attr('input_datetime.den_fan_manual_until', 'timestamp') | float(0)) > now_ts }}"
            then:
              - if:
                  - condition: "template"
                    value_template: "{{ event != 'recover' }}"
                then:
                  - stop: "Manual hold: automatic output suspended."
              - variables:
                  desired_mode: "{{ states('input_select.den_fan_manual_mode') }}"
                  desired_speed: "{{ states('input_select.den_fan_manual_speed') }}"
            else:
              - if:
                  - condition: "template"
                    value_template: "{{ event == 'observe' }}"
                then:
                  - stop: "Evidence updated; policy evaluates once per minute."
              - variables:
                  temp: "{% set n=states(cfg.temperature) %}{{ (n | float * 9/5+32 if state_attr(cfg.temperature,'unit_of_measurement') == '°C' else n | float) if is_number(n) else none }}"
                  rh: "{{ states(cfg.humidity) | float(none) }}"
                  cycle: "{{ states('input_select.den_fan_cycle') }}"
                  cycle_end: "{{ (state_attr('input_datetime.den_fan_cycle_end', 'timestamp') | float(0)) }}"
                  rh_min: "{{ states('sensor.den_fan_humidity_min_10m') | float(none) }}"
              - if:
                  - condition: "template"
                    value_template: "{{ temp is none or not (-100 < temp < 150) or ((rh is none or not (0 <= rh <= 100)) and not (temp >= cfg.heat_at or (cycle == \"heat_relief\" and temp > cfg.heat_stop))) }}"
                then:
                  - action: "input_text.set_value"
                    target:
                      entity_id: "input_text.den_fan_reason"
                    data:
                      value: "Climate unavailable; keeping current fan setting"
                  - stop: "No climate decision with invalid data."
              - variables:
                  plan: "{% set p=namespace(mode='exhaust',cycle=cycle,end=cycle_end,reason='Exhaust: building a humidity buffer') %}\n{% set limit=58 if temp <= 72 else 58+(temp-72) if temp <= 76 else 62+(temp-76)*1.5 if temp < 78 else 65 %}\n{% set rapid=rh is not none and rh_min is not none and rh-rh_min > cfg.rapid_rise_points %}\n{% if temp >= cfg.heat_at or (cycle == 'heat_relief' and temp > cfg.heat_stop) %}\n  {% set p.mode='cool' %}{% set p.cycle='heat_relief' %}{% set p.reason='Cooling: heat priority until ' ~ cfg.heat_stop ~ '°F; humidity limits suspended' %}\n  {% if cycle != 'heat_relief' or now_ts >= p.end %}{% set p.end=now_ts+cfg.burst_minutes*60 %}{% endif %}\n{% else %}\n  {% if cycle in ['burst','extended','heat_relief'] %}{% set p.cycle='cooling' %}{% endif %}\n  {% if p.cycle == 'cooling' %}\n    {% if temp <= cfg.cool_stop or rh >= cfg.max_rh or rapid %}\n      {% set p.cycle='recovery' %}{% set p.end=now_ts+cfg.recovery_minutes*60 %}\n    {% else %}\n      {% set p.mode='cool' %}{% set p.reason='Cooling: working toward ' ~ cfg.cool_stop ~ '°F' %}\n      {% if now_ts >= p.end %}{% set p.end=now_ts+cfg.burst_minutes*60 %}{% endif %}\n    {% endif %}\n  {% endif %}\n  {% if p.mode == 'exhaust' %}\n    {% if p.cycle == 'recovery' and now_ts >= p.end %}{% set p.cycle='normal' %}{% set p.end=0 %}{% endif %}\n    {% if p.cycle == 'recovery' %}{% set p.reason='Exhaust: drying; minimum recovery interval' %}\n    {% elif temp >= cfg.cool_at and rh <= limit and not rapid %}\n      {% set p.mode='cool' %}{% set p.cycle='cooling' %}{% set p.end=now_ts+cfg.burst_minutes*60 %}\n      {% set p.reason='Cooling: humidity buffer available' %}\n    {% elif temp >= cfg.cool_at %}{% set p.reason='Exhaust: drying toward ' ~ (limit | round(1)) ~ '% RH before cooling' %}\n    {% endif %}\n  {% endif %}\n{% endif %}\n{{ dict(mode=p.mode,cycle=p.cycle,end=p.end,reason=p.reason) }}"
              - action: "input_select.select_option"
                target:
                  entity_id: "input_select.den_fan_cycle"
                data:
                  option: "{{ plan.cycle }}"
              - action: "input_datetime.set_datetime"
                target:
                  entity_id: "input_datetime.den_fan_cycle_end"
                data:
                  timestamp: "{{ plan.end }}"
              - action: "input_text.set_value"
                target:
                  entity_id: "input_text.den_fan_reason"
                data:
                  value: "{{ plan.reason }}"
              - variables:
                  desired_mode: "{{ plan.mode }}"
                  desired_speed: "high"
      - if:
          - condition: "template"
            value_template: "{{ event == 'recover' }}"
        then:
          - variables:
              desired_mode: "{{ requested if requested else states('input_select.den_fan_requested_mode') }}"
              desired_speed: "{{ requested_speed if requested_speed else states('input_select.den_fan_requested_speed') }}"
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_manual_mode"
            data:
              option: "{{ desired_mode }}"
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_manual_speed"
            data:
              option: "{{ desired_speed }}"
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.den_fan_reason"
            data:
              value: "Manual hold: recovery requested"
      - action: "input_select.select_option"
        target:
          entity_id: "input_select.den_fan_requested_mode"
        data:
          option: "{{ desired_mode }}"
      - action: "input_select.select_option"
        target:
          entity_id: "input_select.den_fan_requested_speed"
        data:
          option: "{{ desired_speed }}"
      - variables:
          needs_reference: "{{ known not in cfg.ranges or is_state('input_select.den_fan_confidence','uncertain') or is_state('input_boolean.den_fan_command_fault','on') }}"
      - if:
          - condition: "template"
            value_template: "{{ event == 'recover' or (needs_reference and cfg.auto_recovery and not is_state('input_boolean.den_fan_auto_recovery_used','on') and event not in ['manual','observe','power_lost']) }}"
        then:
          - action: "input_boolean.turn_on"
            target:
              entity_id: "input_boolean.den_fan_auto_recovery_used"
          - action: "input_boolean.turn_on"
            target:
              entity_id: "input_boolean.den_fan_command_in_progress"
          - action: "input_boolean.turn_on"
            target:
              entity_id: "input_boolean.den_fan_command_fault"
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_recovery"
            data:
              option: "in_progress"
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_confidence"
            data:
              option: "uncertain"
          - action: "input_boolean.turn_off"
            target:
              entity_id: "input_boolean.den_fan_running"
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.den_fan_error"
            data:
              value: "Recovery step: cutting plug power. If interrupted, run Recover manually."
          - variables:
              off_at: "{{ now().timestamp() }}"
          - action: "switch.turn_off"
            target:
              entity_id: "switch.example_fan_plug"
          - variables:
              deadline: "{{ now().timestamp()+cfg.feedback_timeout }}"
          - repeat:
              sequence:
                - delay:
                    seconds: 1
              until:
                - condition: "template"
                  value_template: "{{ (is_state(cfg.plug,'off')) or now().timestamp() >= deadline }}"
          - if:
              - condition: "template"
                value_template: "{{ not (is_state(cfg.plug,'off')) }}"
            then:
              - action: "input_select.select_option"
                target:
                  entity_id: "input_select.den_fan_confidence"
                data:
                  option: "uncertain"
              - action: "input_boolean.turn_on"
                target:
                  entity_id: "input_boolean.den_fan_command_fault"
              - action: "input_text.set_value"
                target:
                  entity_id: "input_text.den_fan_error"
                data:
                  value: "Recovery failed: plug did not report OFF."
              - action: "input_text.set_value"
                target:
                  entity_id: "input_text.den_fan_outcome"
                data:
                  value: "Stopped safely; physical reference required"
              - if:
                  - condition: "template"
                    value_template: "{{ is_state('input_select.den_fan_recovery','in_progress') }}"
                then:
                  - action: "input_select.select_option"
                    target:
                      entity_id: "input_select.den_fan_recovery"
                    data:
                      option: "failed"
              - action: "input_boolean.turn_off"
                target:
                  entity_id: "input_boolean.den_fan_command_in_progress"
              - stop: "Recovery failed: plug did not report OFF."
          - delay:
              seconds: 15
          - variables:
              deadline: "{{ now().timestamp()+cfg.feedback_timeout }}"
          - repeat:
              sequence:
                - delay:
                    seconds: 1
              until:
                - condition: "template"
                  value_template: "{{ ((is_number(states(cfg.power)) and states(cfg.power)|float >= 0 and now().timestamp()-as_timestamp(states[cfg.power].last_reported,0) <= cfg.power_stale_seconds) and states(cfg.power)|float < cfg.off_below and as_timestamp(states[cfg.power].last_reported,0) >= off_at) or now().timestamp() >= deadline }}"
          - if:
              - condition: "template"
                value_template: "{{ not ((is_number(states(cfg.power)) and states(cfg.power)|float >= 0 and now().timestamp()-as_timestamp(states[cfg.power].last_reported,0) <= cfg.power_stale_seconds) and states(cfg.power)|float < cfg.off_below and as_timestamp(states[cfg.power].last_reported,0) >= off_at) }}"
            then:
              - action: "input_select.select_option"
                target:
                  entity_id: "input_select.den_fan_confidence"
                data:
                  option: "uncertain"
              - action: "input_boolean.turn_on"
                target:
                  entity_id: "input_boolean.den_fan_command_fault"
              - action: "input_text.set_value"
                target:
                  entity_id: "input_text.den_fan_error"
                data:
                  value: "Recovery failed: no fresh stopped-power reading while plug OFF. No Power On sent."
              - action: "input_text.set_value"
                target:
                  entity_id: "input_text.den_fan_outcome"
                data:
                  value: "Stopped safely; physical reference required"
              - if:
                  - condition: "template"
                    value_template: "{{ is_state('input_select.den_fan_recovery','in_progress') }}"
                then:
                  - action: "input_select.select_option"
                    target:
                      entity_id: "input_select.den_fan_recovery"
                    data:
                      option: "failed"
              - action: "input_boolean.turn_off"
                target:
                  entity_id: "input_boolean.den_fan_command_in_progress"
              - stop: "Recovery failed: no fresh stopped-power reading while plug OFF. No Power On sent."
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.den_fan_error"
            data:
              value: "Recovery step: restoring plug power."
          - action: "switch.turn_on"
            target:
              entity_id: "switch.example_fan_plug"
          - variables:
              deadline: "{{ now().timestamp()+cfg.feedback_timeout }}"
          - repeat:
              sequence:
                - delay:
                    seconds: 1
              until:
                - condition: "template"
                  value_template: "{{ (is_state(cfg.plug,'on')) or now().timestamp() >= deadline }}"
          - if:
              - condition: "template"
                value_template: "{{ not (is_state(cfg.plug,'on')) }}"
            then:
              - action: "input_select.select_option"
                target:
                  entity_id: "input_select.den_fan_confidence"
                data:
                  option: "uncertain"
              - action: "input_boolean.turn_on"
                target:
                  entity_id: "input_boolean.den_fan_command_fault"
              - action: "input_text.set_value"
                target:
                  entity_id: "input_text.den_fan_error"
                data:
                  value: "Recovery failed: plug did not report ON."
              - action: "input_text.set_value"
                target:
                  entity_id: "input_text.den_fan_outcome"
                data:
                  value: "Stopped safely; physical reference required"
              - if:
                  - condition: "template"
                    value_template: "{{ is_state('input_select.den_fan_recovery','in_progress') }}"
                then:
                  - action: "input_select.select_option"
                    target:
                      entity_id: "input_select.den_fan_recovery"
                    data:
                      option: "failed"
              - action: "input_boolean.turn_off"
                target:
                  entity_id: "input_boolean.den_fan_command_in_progress"
              - stop: "Recovery failed: plug did not report ON."
          - delay:
              seconds: 3
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.den_fan_error"
            data:
              value: "Recovery step: sending Power On; waiting for fresh running wattage."
          - variables:
              sent_at: "{{ now().timestamp() }}"
          - action: "remote.send_command"
            target:
              entity_id: "remote.example_remote"
            data:
              device: "EXAMPLE_FAN"
              command: "EXAMPLE_ON"
              num_repeats: 1
          - delay:
              seconds: 8
          - variables:
              deadline: "{{ now().timestamp()+cfg.feedback_timeout }}"
          - repeat:
              sequence:
                - delay:
                    seconds: 1
              until:
                - condition: "template"
                  value_template: "{{ ((is_number(states(cfg.power)) and states(cfg.power)|float >= 0 and now().timestamp()-as_timestamp(states[cfg.power].last_reported,0) <= cfg.power_stale_seconds) and states(cfg.power)|float >= cfg.off_below and as_timestamp(states[cfg.power].last_reported,0) > sent_at) or now().timestamp() >= deadline }}"
          - if:
              - condition: "template"
                value_template: "{{ not ((is_number(states(cfg.power)) and states(cfg.power)|float >= 0 and now().timestamp()-as_timestamp(states[cfg.power].last_reported,0) <= cfg.power_stale_seconds) and states(cfg.power)|float >= cfg.off_below and as_timestamp(states[cfg.power].last_reported,0) > sent_at) }}"
            then:
              - action: "input_select.select_option"
                target:
                  entity_id: "input_select.den_fan_confidence"
                data:
                  option: "uncertain"
              - action: "input_boolean.turn_on"
                target:
                  entity_id: "input_boolean.den_fan_command_fault"
              - action: "input_text.set_value"
                target:
                  entity_id: "input_text.den_fan_error"
                data:
                  value: "Recovery failed: Power On produced no fresh running evidence. Inspect plug, fan and BroadLink."
              - action: "input_text.set_value"
                target:
                  entity_id: "input_text.den_fan_outcome"
                data:
                  value: "Stopped safely; physical reference required"
              - if:
                  - condition: "template"
                    value_template: "{{ is_state('input_select.den_fan_recovery','in_progress') }}"
                then:
                  - action: "input_select.select_option"
                    target:
                      entity_id: "input_select.den_fan_recovery"
                    data:
                      option: "failed"
              - action: "input_boolean.turn_off"
                target:
                  entity_id: "input_boolean.den_fan_command_in_progress"
              - stop: "Recovery failed: Power On produced no fresh running evidence. Inspect plug, fan and BroadLink."
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_confirmed_state"
            data:
              option: "cool_low"
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_confidence"
            data:
              option: "established"
          - action: "input_boolean.turn_on"
            target:
              entity_id: "input_boolean.den_fan_running"
          - action: "input_boolean.turn_off"
            target:
              entity_id: "input_boolean.den_fan_command_fault"
          - variables:
              known: "cool_low"
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.den_fan_outcome"
            data:
              value: "Cool/Low reference established after power reset"
        else:
          - if:
              - condition: "template"
                value_template: "{{ needs_reference }}"
            then:
              - action: "input_select.select_option"
                target:
                  entity_id: "input_select.den_fan_confidence"
                data:
                  option: "uncertain"
              - action: "input_boolean.turn_on"
                target:
                  entity_id: "input_boolean.den_fan_command_fault"
              - action: "input_text.set_value"
                target:
                  entity_id: "input_text.den_fan_error"
                data:
                  value: "State uncertain. Confirm Physical State or Recover / Reinitialize; no toggles sent."
              - action: "input_text.set_value"
                target:
                  entity_id: "input_text.den_fan_outcome"
                data:
                  value: "Stopped safely; physical reference required"
              - if:
                  - condition: "template"
                    value_template: "{{ is_state('input_select.den_fan_recovery','in_progress') }}"
                then:
                  - action: "input_select.select_option"
                    target:
                      entity_id: "input_select.den_fan_recovery"
                    data:
                      option: "failed"
              - action: "input_boolean.turn_off"
                target:
                  entity_id: "input_boolean.den_fan_command_in_progress"
              - stop: "State uncertain. Confirm Physical State or Recover / Reinitialize; no toggles sent."
      - if:
          - condition: "template"
            value_template: "{{ not is_state(cfg.plug,'on') }}"
        then:
          - action: "input_boolean.turn_off"
            target:
              entity_id: "input_boolean.den_fan_running"
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_confidence"
            data:
              option: "uncertain"
          - action: "input_boolean.turn_on"
            target:
              entity_id: "input_boolean.den_fan_command_fault"
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.den_fan_error"
            data:
              value: "Plug is not on. Recover after power is restored."
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.den_fan_outcome"
            data:
              value: "Stopped safely; physical reference required"
          - if:
              - condition: "template"
                value_template: "{{ is_state('input_select.den_fan_recovery','in_progress') }}"
            then:
              - action: "input_select.select_option"
                target:
                  entity_id: "input_select.den_fan_recovery"
                data:
                  option: "failed"
          - action: "input_boolean.turn_off"
            target:
              entity_id: "input_boolean.den_fan_command_in_progress"
          - stop: "Plug is not on. Recover after power is restored."
      - if:
          - condition: "template"
            value_template: "{{ (is_number(states(cfg.power)) and states(cfg.power)|float >= 0 and now().timestamp()-as_timestamp(states[cfg.power].last_reported,0) <= cfg.power_stale_seconds) and states(cfg.power)|float < cfg.off_below }}"
        then:
          - action: "input_boolean.turn_off"
            target:
              entity_id: "input_boolean.den_fan_running"
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_confidence"
            data:
              option: "uncertain"
          - action: "input_boolean.turn_on"
            target:
              entity_id: "input_boolean.den_fan_command_fault"
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.den_fan_error"
            data:
              value: "Fan appears stopped. Recover before sending toggles."
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.den_fan_outcome"
            data:
              value: "Stopped safely; physical reference required"
          - if:
              - condition: "template"
                value_template: "{{ is_state('input_select.den_fan_recovery','in_progress') }}"
            then:
              - action: "input_select.select_option"
                target:
                  entity_id: "input_select.den_fan_recovery"
                data:
                  option: "failed"
          - action: "input_boolean.turn_off"
            target:
              entity_id: "input_boolean.den_fan_command_in_progress"
          - stop: "Fan appears stopped. Recover before sending toggles."
      - variables:
          expected: "{{ states('input_select.den_fan_confirmed_state') }}"
      - if:
          - condition: "template"
            value_template: "{{ (is_number(states(cfg.power)) and states(cfg.power)|float >= 0 and now().timestamp()-as_timestamp(states[cfg.power].last_reported,0) <= cfg.power_stale_seconds) and not (expected in cfg.ranges and cfg.ranges[expected][0]-cfg.range_tolerance <= states(cfg.power)|float <= cfg.ranges[expected][1]+cfg.range_tolerance) and not is_state('input_select.den_fan_confidence','established') }}"
        then:
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.den_fan_confidence"
            data:
              option: "uncertain"
          - action: "input_boolean.turn_on"
            target:
              entity_id: "input_boolean.den_fan_command_fault"
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.den_fan_error"
            data:
              value: "Power conflicts with expected state. Confirm physical setting or Recover; history retained."
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.den_fan_outcome"
            data:
              value: "Stopped safely; physical reference required"
          - if:
              - condition: "template"
                value_template: "{{ is_state('input_select.den_fan_recovery','in_progress') }}"
            then:
              - action: "input_select.select_option"
                target:
                  entity_id: "input_select.den_fan_recovery"
                data:
                  option: "failed"
          - action: "input_boolean.turn_off"
            target:
              entity_id: "input_boolean.den_fan_command_in_progress"
          - stop: "Power conflicts with expected state. Confirm physical setting or Recover; history retained."
      - variables:
          mode_order:
            - "cool"
            - "exhaust"
            - "circulate"
          speed_order:
            - "low"
            - "med"
            - "high"
      - variables:
          mode_presses: "{{ (mode_order.index(desired_mode)-mode_order.index(known.split('_')[0]))%3 }}"
          speed_presses: "{{ (speed_order.index(desired_speed)-speed_order.index(known.split('_')[1]))%3 }}"
      - repeat:
          count: "{{ mode_presses }}"
          sequence:
            - if:
                - condition: "template"
                  value_template: "{{ event not in ['manual','recover','synchronize'] and (state_attr('input_datetime.den_fan_manual_until', 'timestamp') | float(0)) > now().timestamp() }}"
              then:
