  den_fan_confirm_state:
    alias: "Den Fan - Confirm Physical State"
    mode: "parallel"
    max: 10
    fields:
      setting:
        required: true
        selector:
          select:
            options:
              - "cool_low"
              - "cool_med"
              - "cool_high"
              - "exhaust_low"
              - "exhaust_med"
              - "exhaust_high"
              - "circulate_low"
              - "circulate_med"
              - "circulate_high"
    sequence:
      - if:
          - condition: "template"
            value_template: "{{ setting not in ['cool_low', 'cool_med', 'cool_high', 'exhaust_low', 'exhaust_med', 'exhaust_high', 'circulate_low', 'circulate_med', 'circulate_high'] }}"
        then:
          - stop: "Invalid physical setting."
      - action: "script.den_fan_set_state"
        data:
          event: "synchronize"
          target_function: "{{ setting.split('_')[0] }}"
          target_speed: "{{ setting.split('_')[1] }}"
automation:
  - id: "den_fan_continuous_control_v2"
    alias: "Den Fan - Continuous Control"
    mode: "parallel"
    max: 5
    trace:
      stored_traces: 20
    triggers:
      - trigger: "time_pattern"
        minutes: "/1"
        id: "evaluate"
      - trigger: "homeassistant"
        event: "start"
        id: "startup"
      - trigger: "state"
        entity_id:
          - "sensor.example_temperature"
          - "sensor.example_humidity"
        id: "observe"
      - trigger: "time"
        at: "input_datetime.den_fan_manual_until"
        id: "evaluate"
      - trigger: "state"
        entity_id: "switch.example_fan_plug"
