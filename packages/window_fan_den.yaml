                - stop: "Power no longer supports the last confirmed setting. No further presses sent."
            - variables:
                expected: "{{ before.split('_')[0] ~ '_' ~ speed_order[(speed_order.index(before.split('_')[1])+1)%3] }}"
                sent_at: "{{ now().timestamp() }}"
                deadline: "{{ now().timestamp() + cfg.feedback_timeout }}"
            - action: "input_datetime.set_datetime"
              target:
                entity_id: "input_datetime.den_fan_command_guard_until"
              data:
                timestamp: "{{ deadline + cfg.stable_seconds + 5 }}"
            - action: "remote.send_command"
              target:
                entity_id: "remote.den_fan_remote"
              data:
                device: "Den Fan"
                command: "speed_toggle"
            - repeat:
                sequence:
                  - delay:
                      seconds: 1
                until:
                  - condition: "template"
                    value_template: "{{ (is_number(states(cfg.power)) and expected in cfg.ranges and cfg.ranges[expected][0] - cfg.range_tolerance <= states(cfg.power) | float <= cfg.ranges[expected][1] + cfg.range_tolerance and not (is_number(states(cfg.power)) and before in cfg.ranges and cfg.ranges[before][0] - cfg.range_tolerance <= states(cfg.power) | float <= cfg.ranges[before][1] + cfg.range_tolerance) and as_timestamp(states[cfg.power].last_updated,0) > sent_at and now().timestamp() - as_timestamp(states['sensor.den_fan_power_candidates'].last_changed, 0) >= cfg.stable_seconds) or now().timestamp() >= deadline }}"
            - if:
                - condition: "template"
                  value_template: "{{ not (is_number(states(cfg.power)) and expected in cfg.ranges and cfg.ranges[expected][0] - cfg.range_tolerance <= states(cfg.power) | float <= cfg.ranges[expected][1] + cfg.range_tolerance and not (is_number(states(cfg.power)) and before in cfg.ranges and cfg.ranges[before][0] - cfg.range_tolerance <= states(cfg.power) | float <= cfg.ranges[before][1] + cfg.range_tolerance) and as_timestamp(states[cfg.power].last_updated,0) > sent_at and now().timestamp() - as_timestamp(states['sensor.den_fan_power_candidates'].last_changed, 0) >= cfg.stable_seconds) }}"
              then:
