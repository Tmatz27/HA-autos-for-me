      - variables:
          current: "{{ states('input_select.den_fan_confirmed_state') }}"
      - variables:
          speed_presses: "{{ (speed_order.index(target_speed) - speed_order.index(current.split('_')[1])) % 3 }}"
      - alias: "Confirm each speed press"
        repeat:
          count: "{{ speed_presses }}"
          sequence:
            - variables:
