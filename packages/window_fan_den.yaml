  den_fan_confirm_state:
    alias: "Den Fan - Confirm Physical Setting"
    mode: "queued"
    description: "Select the setting verified on the physical fan. Sends no remote commands; starts a manual hold."
    fields:
      setting:
        required: true
        selector:
          select:
            options:
              - "cool_low"
              - "cool_med"
              - "cool_high"
              - "exhaust_low"
              - "exhaust_med"
              - "exhaust_high"
              - "circulate_low"
              - "circulate_med"
              - "circulate_high"
    sequence:
      - if:
          - condition: "template"
            value_template: "{{ setting not in ['cool_low', 'cool_med', 'cool_high', 'exhaust_low', 'exhaust_med', 'exhaust_high', 'circulate_low', 'circulate_med', 'circulate_high'] }}"
        then:
          - stop: "Invalid setting."
      - action: "script.den_fan_set_state"
        data:
          event: "synchronize"
          target_function: "{{ setting.split('_')[0] }}"
          target_speed: "{{ setting.split('_')[1] }}"
automation:
  - id: "den_fan_continuous_control_v2"
    alias: "Den Fan - Continuous Control"
    mode: "queued"
    max: 3
    max_exceeded: "silent"
    trace:
      stored_traces: 20
    triggers:
      - trigger: "time_pattern"
        minutes: "/1"
        id: "evaluate"
      - trigger: "homeassistant"
        event: "start"
        id: "startup"
      - trigger: "state"
        entity_id: "sensor.den_fan_power_candidates"
        for:
          seconds: 15
        id: "observe"
    actions:
      - action: "script.den_fan_set_state"
        data:
          event: "{{ trigger.id | default('evaluate') }}"
