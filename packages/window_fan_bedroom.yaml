            value_template: "{{ states('sensor.bedroom_fan_state').split('_')[0] != plan.mode }}"
        then:
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.bedroom_fan_error"
            data:
              value: "Mode not confirmed; speed commands were not sent."
          - action: "input_datetime.set_datetime"
            target:
              entity_id: "input_datetime.bedroom_fan_retry_after"
            data:
              timestamp: "{{ now().timestamp() + cfg.retry_seconds }}"
          - stop: "Mode not confirmed; speed commands were not sent."
            error: true
      - variables:
          speed_presses: "{{ (speed_order.index(desired_speed) - speed_order.index(after_mode.split('_')[1])) % 3 }}"
      - repeat:
          count: "{{ speed_presses }}"
          sequence:
            - if:
                - condition: "template"
                  value_template: "{{ not (is_number(states(cfg.power)) and states(cfg.power) | float >= 0 and states('sensor.bedroom_fan_state') in ['cool_low', 'cool_med', 'cool_high', 'exhaust_low', 'exhaust_med', 'exhaust_high', 'circulate_low', 'circulate_med', 'circulate_high'] and (cfg.power_max_age <= 0 or (now().timestamp() - as_timestamp(states[cfg.power].last_reported, 0)) <= cfg.power_max_age)) }}"
              then:
                - action: "input_text.set_value"
                  target:
                    entity_id: "input_text.bedroom_fan_error"
                  data:
                    value: "Invalid power feedback before a remote press."
                - action: "input_datetime.set_datetime"
                  target:
                    entity_id: "input_datetime.bedroom_fan_retry_after"
                  data:
                    timestamp: "{{ now().timestamp() + cfg.retry_seconds }}"
                - stop: "Invalid power feedback before a remote press."
                  error: true
            - variables:
                before_state: "{{ states('sensor.bedroom_fan_state') }}"
            - variables:
                expected_state: "{{ before_state.split('_')[0] ~ '_' ~ speed_order[(speed_order.index(before_state.split('_')[1])+1)%3] }}"
                command_at: "{{ now().timestamp() }}"
                feedback_deadline: "{{ now().timestamp() + cfg.feedback_timeout }}"
            - action: "input_datetime.set_datetime"
              target:
                entity_id: "input_datetime.bedroom_fan_command_guard_until"
              data:
                timestamp: "{{ now().timestamp() + cfg.feedback_timeout + cfg.settle_seconds + 10 }}"
            - action: "remote.send_command"
              target:
                entity_id: "remote.bedroom_fan_remote"
              data:
                device: "Bedroom Fan"
