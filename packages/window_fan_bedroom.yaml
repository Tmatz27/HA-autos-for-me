                  value_template: "{{ not (is_number(states(cfg.power)) and states(cfg.power) | float >= 0 and states('sensor.bedroom_fan_state') in ['cool_low', 'cool_med', 'cool_high', 'exhaust_low', 'exhaust_med', 'exhaust_high', 'circulate_low', 'circulate_med', 'circulate_high'] and (cfg.power_max_age <= 0 or (now().timestamp() - as_timestamp(states[cfg.power].last_reported, 0)) <= cfg.power_max_age) and as_timestamp(states[cfg.power].last_updated, 0) > command_at and states('sensor.bedroom_fan_state') == expected_state) }}"
              then:
                - action: "input_text.set_value"
                  target:
                    entity_id: "input_text.bedroom_fan_error"
                  data:
                    value: "Fan feedback did not settle at the expected state; stopping the sequence."
                - action: "input_datetime.set_datetime"
                  target:
                    entity_id: "input_datetime.bedroom_fan_retry_after"
                  data:
                    timestamp: "{{ now().timestamp() + cfg.retry_seconds }}"
                - stop: "Fan feedback did not settle at the expected state; stopping the sequence."
                  error: true
      - variables:
