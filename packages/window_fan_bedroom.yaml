# Window Fan - Bedroom - continuous High-speed control
# Replace the previous bedroom package; do not enable both versions.
# SETTINGS: edit cfg in script.bedroom_fan_set_state.sequence[0].variables.
# Calibration helpers restore their values. First run seeds EXAMPLE ranges.
# Measure all nine states before enabling control; edit via card or Helpers.
# No fan-off commands. All external entity IDs are placeholders.
# Power-command name is optional and blank until you supply a learned on/off code.
input_boolean:
  bedroom_fan_calibration_initialized:
    name: "Bedroom Fan Calibration Initialized"
  bedroom_fan_night_phase:
    name: "Bedroom Fan Night Phase"
  bedroom_fan_morning_recovery:
    name: "Bedroom Fan Morning Recovery"
  bedroom_fan_humidity_protection:
    name: "Bedroom Fan Humidity Protection"
input_datetime:
  bedroom_fan_last_command_time:
    name: "Bedroom Fan Last Command Time"
    has_date: true
    has_time: true
  bedroom_fan_command_guard_until:
    name: "Bedroom Fan Command Guard Until"
    has_date: true
    has_time: true
  bedroom_fan_cycle_end:
    name: "Bedroom Fan Cycle End"
    has_date: true
    has_time: true
  bedroom_fan_retry_after:
    name: "Bedroom Fan Retry After"
    has_date: true
    has_time: true
  bedroom_fan_manual_until:
    name: "Bedroom Fan Manual Until"
    has_date: true
    has_time: true
  bedroom_fan_sleep_until:
    name: "Bedroom Fan Sleep Until"
    has_date: true
    has_time: true
  bedroom_fan_last_morning:
    name: "Bedroom Fan Last Morning"
    has_date: true
    has_time: true
input_select:
  bedroom_fan_cycle:
    name: "Bedroom Fan Cycle"
    options:
      - "normal"
      - "burst"
      - "extension"
      - "recovery"
  bedroom_fan_manual_mode:
    name: "Bedroom Fan Manual Mode"
    options:
      - "cool"
      - "exhaust"
      - "circulate"
  bedroom_fan_manual_speed:
    name: "Bedroom Fan Manual Speed"
    options:
      - "low"
      - "med"
      - "high"
  bedroom_fan_requested_mode:
    name: "Bedroom Fan Requested Mode"
    options:
      - "cool"
      - "exhaust"
      - "circulate"
input_text:
  bedroom_fan_reason:
    name: "Bedroom Fan Reason"
    max: 255
  bedroom_fan_error:
    name: "Bedroom Fan Error"
    max: 255
input_number:
  bedroom_fan_watts_off_below:
    name: "Bedroom Fan Watts Off Below"
    min: 0
    max: 500
    step: 0.1
    mode: "box"
    unit_of_measurement: "W"
  bedroom_fan_watts_exhaust_low_upper:
    name: "Bedroom Fan Watts Exhaust Low Upper"
    min: 0
    max: 500
    step: 0.1
    mode: "box"
    unit_of_measurement: "W"
  bedroom_fan_watts_exhaust_med_upper:
    name: "Bedroom Fan Watts Exhaust Med Upper"
    min: 0
    max: 500
    step: 0.1
    mode: "box"
    unit_of_measurement: "W"
  bedroom_fan_watts_exhaust_high_upper:
    name: "Bedroom Fan Watts Exhaust High Upper"
    min: 0
    max: 500
    step: 0.1
    mode: "box"
    unit_of_measurement: "W"
  bedroom_fan_watts_circulate_low_upper:
    name: "Bedroom Fan Watts Circulate Low Upper"
    min: 0
    max: 500
    step: 0.1
    mode: "box"
    unit_of_measurement: "W"
  bedroom_fan_watts_circulate_med_upper:
    name: "Bedroom Fan Watts Circulate Med Upper"
    min: 0
    max: 500
    step: 0.1
    mode: "box"
    unit_of_measurement: "W"
  bedroom_fan_watts_circulate_high_upper:
    name: "Bedroom Fan Watts Circulate High Upper"
    min: 0
    max: 500
    step: 0.1
    mode: "box"
    unit_of_measurement: "W"
  bedroom_fan_watts_cool_low_upper:
    name: "Bedroom Fan Watts Cool Low Upper"
    min: 0
    max: 500
    step: 0.1
    mode: "box"
    unit_of_measurement: "W"
  bedroom_fan_watts_cool_med_upper:
    name: "Bedroom Fan Watts Cool Med Upper"
    min: 0
    max: 500
    step: 0.1
    mode: "box"
    unit_of_measurement: "W"
template:
  - sensor:
      - name: "Bedroom Fan State"
        unique_id: "bedroom_fan_state"
        icon: "mdi:fan"
        state: >-
          {% set raw = states('sensor.bedroom_fan_power') %}
          {% set bounds = [states('input_number.bedroom_fan_watts_off_below') | float(-1), states('input_number.bedroom_fan_watts_exhaust_low_upper') | float(-1), states('input_number.bedroom_fan_watts_exhaust_med_upper') | float(-1), states('input_number.bedroom_fan_watts_exhaust_high_upper') | float(-1), states('input_number.bedroom_fan_watts_circulate_low_upper') | float(-1), states('input_number.bedroom_fan_watts_circulate_med_upper') | float(-1), states('input_number.bedroom_fan_watts_circulate_high_upper') | float(-1), states('input_number.bedroom_fan_watts_cool_low_upper') | float(-1), states('input_number.bedroom_fan_watts_cool_med_upper') | float(-1)] %}
          {% set ns = namespace(valid=true) %}
          {% for i in range(1, bounds | length) %}
            {% if bounds[i] <= bounds[i-1] %}{% set ns.valid = false %}{% endif %}
          {% endfor %}
          {% if not is_state('input_boolean.bedroom_fan_calibration_initialized', 'on') or not ns.valid or bounds[0] < 0 %}unknown
          {% elif not is_number(raw) or raw | float < 0 %}unknown
          {% elif raw | float < bounds[0] %}off
          {% else %}
            {% set labels = ['exhaust_low', 'exhaust_med', 'exhaust_high', 'circulate_low', 'circulate_med', 'circulate_high', 'cool_low', 'cool_med', 'cool_high'] %}
            {% set match = namespace(value='cool_high', found=false) %}
            {% for i in range(1, bounds | length) %}
              {% if not match.found and raw | float < bounds[i] %}
                {% set match.value = labels[i-1] %}{% set match.found = true %}
              {% endif %}
            {% endfor %}
            {{ match.value }}
          {% endif %}
        attributes:
          power_sensor: "sensor.bedroom_fan_power"
          calibration_prefix: "bedroom_fan"
          manual_control: true
          controller_script: "script.bedroom_fan_set_state"
          status_sensor: "sensor.bedroom_fan_control_status"
          temperature_sensor: "sensor.bedroom_temperature"
          humidity_sensor: "sensor.bedroom_humidity"
          off_below: "{{ states('input_number.bedroom_fan_watts_off_below') | float(0) }}"
          exhaust_low_upper: "{{ states('input_number.bedroom_fan_watts_exhaust_low_upper') | float(0) }}"
          exhaust_med_upper: "{{ states('input_number.bedroom_fan_watts_exhaust_med_upper') | float(0) }}"
          exhaust_high_upper: "{{ states('input_number.bedroom_fan_watts_exhaust_high_upper') | float(0) }}"
          circulate_low_upper: "{{ states('input_number.bedroom_fan_watts_circulate_low_upper') | float(0) }}"
          circulate_med_upper: "{{ states('input_number.bedroom_fan_watts_circulate_med_upper') | float(0) }}"
          circulate_high_upper: "{{ states('input_number.bedroom_fan_watts_circulate_high_upper') | float(0) }}"
          cool_low_upper: "{{ states('input_number.bedroom_fan_watts_cool_low_upper') | float(0) }}"
          cool_med_upper: "{{ states('input_number.bedroom_fan_watts_cool_med_upper') | float(0) }}"
      - name: "Bedroom Fan Control Status"
        unique_id: "bedroom_fan_control_status"
        icon: "mdi:fan-auto"
        state: "{{ states('input_text.bedroom_fan_reason') }}"
        attributes:
          manual_until_timestamp: "{{ state_attr('input_datetime.bedroom_fan_manual_until', 'timestamp') | float(0) }}"
          manual_active: "{{ state_attr('input_datetime.bedroom_fan_manual_until', 'timestamp') | float(0) > now().timestamp() }}"
          error: "{{ states('input_text.bedroom_fan_error') }}"
          requested_mode: "{{ states('input_select.bedroom_fan_requested_mode') }}"
          cycle: "{{ states('input_select.bedroom_fan_cycle') }}"
          cycle_end: "{{ states('input_datetime.bedroom_fan_cycle_end') }}"
          cycle_end_timestamp: "{{ state_attr('input_datetime.bedroom_fan_cycle_end', 'timestamp') | float(0) }}"
          night: "{{ is_state('input_boolean.bedroom_fan_night_phase','on') }}"
          morning_drying: "{{ is_state('input_boolean.bedroom_fan_morning_recovery','on') }}"
  - binary_sensor:
      - name: "Bedroom Fan Is Cool"
        unique_id: "bedroom_fan_is_cool"
        availability: "{{ states('sensor.bedroom_fan_state') in ['cool_low', 'cool_med', 'cool_high', 'exhaust_low', 'exhaust_med', 'exhaust_high', 'circulate_low', 'circulate_med', 'circulate_high', 'off'] }}"
        state: "{{ states('sensor.bedroom_fan_state').startswith('cool_') }}"
script:
  bedroom_fan_set_state:
    alias: "Bedroom Fan - Serialized Controller"
    mode: "queued"
    max: 5
    max_exceeded: "silent"
    description: "All card and automation requests enter this queue. Automatic control uses High; manual selections hold for 30 minutes. Never turns the fan off."
    fields:
      event:
        name: "Request source"
        selector:
          select:
            options:
              - "evaluate"
              - "manual"
              - "resume_auto"
              - "tv_off"
              - "observed_cool"
      target_function:
        name: "Manual mode request"
        selector:
          select:
            options:
              - "cool"
              - "exhaust"
              - "circulate"
      target_speed:
        name: "Manual speed request"
        selector:
          select:
            options:
              - "low"
              - "med"
              - "high"
    sequence:
      - variables:
          cfg:
            power: "sensor.bedroom_fan_power"
            plug: "switch.bedroom_fan_plug"
            remote: "remote.bedroom_fan_remote"
            device: "Bedroom Fan"
            mode_command: "mode_toggle"
            press_delay: 1
            temperature: "sensor.bedroom_temperature"
            humidity: "sensor.bedroom_humidity"
            outdoor_temperature: "sensor.outdoor_temperature"
            outdoor_humidity: "sensor.outdoor_humidity"
            power_command: ""
            speed_command: "speed_toggle"
            feedback_timeout: 60
            settle_seconds: 2
            retry_seconds: 300
            power_max_age: 0
            room_max_age: 900
            weather_max_age: 7200
            manual_minutes: 30
            minimum_mode_seconds: 180
            burst_minutes: 30
            recovery_minutes: 15
            bedtime_time: "22:00:00"
            morning_time: "06:00:00"
            cool_at: 73
            dry_target: 60
            dry_release: 62
            protect_on: 15
            protect_off: 8
            burst_at: 75
            burst_stop: 73
            extension_rh: 64
      - if:
          - condition: "template"
            value_template: "{{ not is_state('input_boolean.bedroom_fan_calibration_initialized', 'on') }}"
        then:
          - action: "input_number.set_value"
            target:
              entity_id: "input_number.bedroom_fan_watts_off_below"
            data:
              value: 10
          - action: "input_number.set_value"
            target:
              entity_id: "input_number.bedroom_fan_watts_exhaust_low_upper"
            data:
              value: 32
          - action: "input_number.set_value"
            target:
              entity_id: "input_number.bedroom_fan_watts_exhaust_med_upper"
            data:
              value: 34.5
          - action: "input_number.set_value"
            target:
              entity_id: "input_number.bedroom_fan_watts_exhaust_high_upper"
            data:
              value: 37
          - action: "input_number.set_value"
            target:
              entity_id: "input_number.bedroom_fan_watts_circulate_low_upper"
            data:
              value: 41
          - action: "input_number.set_value"
            target:
              entity_id: "input_number.bedroom_fan_watts_circulate_med_upper"
            data:
              value: 44
          - action: "input_number.set_value"
            target:
              entity_id: "input_number.bedroom_fan_watts_circulate_high_upper"
            data:
              value: 46
          - action: "input_number.set_value"
            target:
              entity_id: "input_number.bedroom_fan_watts_cool_low_upper"
            data:
              value: 48
          - action: "input_number.set_value"
            target:
              entity_id: "input_number.bedroom_fan_watts_cool_med_upper"
            data:
              value: 50
          - action: "input_boolean.turn_on"
            target:
              entity_id: "input_boolean.bedroom_fan_calibration_initialized"
          - delay:
              seconds: 1
      - variables:
          event: "{{ event | default('manual' if target_function is defined or target_speed is defined else 'evaluate') }}"
          requested: "{{ target_function | default('') }}"
          requested_speed: "{{ target_speed | default('') }}"
          now_ts: "{{ now().timestamp() }}"
          temp: "{% set v = states(cfg.temperature) %}{{ (v | float * 9 / 5 + 32 if state_attr(cfg.temperature, 'unit_of_measurement') == '°C' else v | float) if is_number(v) else 0 }}"
          rh: "{{ states(cfg.humidity) | float(0) }}"
          outside_rh: "{{ states(cfg.outdoor_humidity) | float(0) }}"
          outside_temp: "{% set v = states(cfg.outdoor_temperature) %}{{ (v | float * 9 / 5 + 32 if state_attr(cfg.outdoor_temperature, 'unit_of_measurement') == '°C' else v | float) if is_number(v) else 0 }}"
          cycle: "{{ states('input_select.bedroom_fan_cycle') }}"
          cycle_end: "{{ state_attr('input_datetime.bedroom_fan_cycle_end', 'timestamp') | float(0) }}"
          previous_mode: "{{ states('input_select.bedroom_fan_requested_mode') }}"
      - variables:
          climate_valid: >-
            {% set ns = namespace(ok=true) %}
            {% for id in [cfg.temperature, cfg.humidity] %}
              {% set age = cfg.room_max_age %}
              {% if not is_number(states(id)) %}{% set ns.ok = false %}
              {% elif now().timestamp() - as_timestamp(states[id].last_reported, 0) > age %}{% set ns.ok = false %}{% endif %}
            {% endfor %}
            {{ ns.ok and 0 <= rh <= 100 and -100 < temp < 150 }}
          weather_valid: "{{ is_number(states(cfg.outdoor_humidity)) and 0 <= outside_rh <= 100 and now().timestamp() - as_timestamp(states[cfg.outdoor_humidity].last_reported, 0) <= cfg.weather_max_age }}"
      - variables:
          night: "{{ is_state('input_boolean.bedroom_fan_night_phase','on') }}"
          morning: "{{ is_state('input_boolean.bedroom_fan_morning_recovery','on') }}"
          protection: "{{ is_state('input_boolean.bedroom_fan_humidity_protection','on') }}"
          sleep_end: "{{ state_attr('input_datetime.bedroom_fan_sleep_until', 'timestamp') | float(0) }}"
          morning_at: "{{ state_attr('input_datetime.bedroom_fan_last_morning', 'timestamp') | float(0) }}"
          clock: "{{ now().strftime('%H:%M:%S') }}"
          bedtime_clock: "{{ cfg.bedtime_time }}"
          morning_clock: "{{ cfg.morning_time }}"
          event_clock: "{{ as_local(as_datetime(event_at)).strftime('%H:%M:%S') if event_at is defined else clock }}"
          latest_morning: "{{ as_timestamp(today_at(cfg.morning_time) if now() >= today_at(cfg.morning_time) else today_at(cfg.morning_time) - timedelta(days=1)) }}"
          next_morning: "{{ as_timestamp(today_at(cfg.morning_time) if now() < today_at(cfg.morning_time) else today_at(cfg.morning_time) + timedelta(days=1)) }}"
      - if:
          - condition: "template"
            value_template: "{{ event == 'evaluate' and (clock >= bedtime_clock or clock < morning_clock) and is_state('binary_sensor.bedroom_fan_is_cool','on') and (state_attr('input_datetime.bedroom_fan_last_command_time','timestamp') | float(0)) < as_timestamp(states.binary_sensor.bedroom_fan_is_cool.last_changed, 0) and now().timestamp() - as_timestamp(states.binary_sensor.bedroom_fan_is_cool.last_changed, 0) < 10 }}"
        then:
          - stop: "Waiting briefly for a possible manual bedtime selection."
      - if:
          - condition: "template"
            value_template: "{{ event == 'manual' and (requested not in ['', 'cool', 'exhaust', 'circulate'] or requested_speed not in ['', 'low', 'med', 'high']) }}"
        then:
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.bedroom_fan_error"
            data:
              value: "Invalid manual mode or speed."
          - action: "input_datetime.set_datetime"
            target:
              entity_id: "input_datetime.bedroom_fan_retry_after"
            data:
              timestamp: "{{ now().timestamp() + cfg.retry_seconds }}"
          - stop: "Invalid manual mode or speed."
            error: true
      - variables:
          manual_request: "{{ event == 'manual' and (requested != '' or requested_speed != '') }}"
          observed_state: "{{ states('sensor.bedroom_fan_state') }}"
      - if:
          - condition: "template"
            value_template: "{{ manual_request and observed_state not in ['cool_low', 'cool_med', 'cool_high', 'exhaust_low', 'exhaust_med', 'exhaust_high', 'circulate_low', 'circulate_med', 'circulate_high'] and (requested == '' or requested_speed == '') }}"
        then:
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.bedroom_fan_error"
            data:
              value: "Fan state unavailable; cannot preserve the other mode/speed setting. Check power and calibration."
          - action: "input_datetime.set_datetime"
            target:
              entity_id: "input_datetime.bedroom_fan_retry_after"
            data:
              timestamp: "{{ now().timestamp() + cfg.retry_seconds }}"
          - stop: "Fan state unavailable; cannot preserve the other mode/speed setting. Check power and calibration."
            error: true
      - if:
          - condition: "template"
            value_template: "{{ event == 'resume_auto' or (event in ['tv_off','observed_cool'] and (clock >= bedtime_clock or clock < morning_clock) and (event_clock >= bedtime_clock or event_clock < morning_clock)) or (event == 'evaluate' and night and (now_ts >= sleep_end or not (clock >= bedtime_clock or clock < morning_clock))) }}"
        then:
          - action: "input_datetime.set_datetime"
            target:
              entity_id: "input_datetime.bedroom_fan_manual_until"
            data:
              timestamp: "{{ now_ts }}"
      - if:
          - condition: "template"
            value_template: "{{ manual_request }}"
        then:
          - variables:
              selected_mode: "{{ requested if requested != '' else observed_state.split('_')[0] }}"
              selected_speed: "{{ requested_speed if requested_speed != '' else ('high' if (requested == 'cool' and (clock >= bedtime_clock or clock < morning_clock)) else observed_state.split('_')[1]) }}"
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.bedroom_fan_manual_mode"
            data:
              option: "{{ selected_mode }}"
          - action: "input_select.select_option"
            target:
              entity_id: "input_select.bedroom_fan_manual_speed"
            data:
              option: "{{ selected_speed }}"
          - action: "input_datetime.set_datetime"
            target:
              entity_id: "input_datetime.bedroom_fan_manual_until"
            data:
              timestamp: "{{ now_ts + cfg.manual_minutes * 60 }}"
      - variables:
          manual_active: "{{ state_attr('input_datetime.bedroom_fan_manual_until', 'timestamp') | float(0) > now_ts }}"
          desired_speed: "{{ states('input_select.bedroom_fan_manual_speed') if state_attr('input_datetime.bedroom_fan_manual_until', 'timestamp') | float(0) > now_ts else 'high' }}"
      - variables:
          plan: >-
            {# Pure decision: memory and deadlines are passed in, never mutate HA here. #}
            {% set p = namespace(mode='exhaust', cycle=cycle, end=cycle_end,
              night=night, morning=morning, protection=protection,
              sleep_end=sleep_end, morning_at=morning_at, reason='Exhaust: continuous ventilation') %}
            {% set overnight = clock >= bedtime_clock or clock < morning_clock %}
            {% set event_overnight = event_clock >= bedtime_clock or event_clock < morning_clock %}
            {% if morning_at < latest_morning %}
              {% set p.morning_at = latest_morning %}
              {% set p.night = false %}{% set p.morning = true %}
              {% set p.cycle = 'normal' %}{% set p.end = 0 %}
            {% endif %}
            {% if p.night and (now_ts >= p.sleep_end or not overnight) %}
              {% set p.night = false %}{% set p.morning = true %}
              {% set p.cycle = 'normal' %}{% set p.end = 0 %}
            {% endif %}
            {% if overnight and event_overnight and (event == 'tv_off' or event == 'observed_cool' or
                (event == 'manual' and requested == 'cool')) %}
              {% set p.night = true %}{% set p.morning = false %}
              {% set p.sleep_end = next_morning %}
              {% set p.cycle = 'normal' %}{% set p.end = 0 %}
            {% endif %}
            {% if climate_valid and weather_valid %}
              {% set gap = outside_rh - rh %}
              {% if gap >= cfg.protect_on %}{% set p.protection = true %}
              {% elif gap < cfg.protect_off %}{% set p.protection = false %}{% endif %}
            {% elif not weather_valid %}
              {% set p.protection = true %}
            {% endif %}
            {% if p.night %}
              {% set p.mode = 'cool' %}
              {% set p.reason = 'Sleep lock: Cool / High until ' ~ cfg.morning_time %}
            {% elif not climate_valid %}
              {% set p.mode = 'exhaust' %}
              {% set p.cycle = 'normal' %}{% set p.end = 0 %}
              {% set p.reason = 'Exhaust: climate reading missing, stale, or invalid' %}
            {% else %}
              {% if p.morning and (rh <= cfg.dry_target or (rh <= cfg.dry_release and temp > cfg.cool_at)) %}
                {% set p.morning = false %}
              {% endif %}
              {% set restricted = p.morning or p.protection or rh > cfg.dry_release %}
              {% if p.cycle in ['burst', 'extension'] %}
                {% if temp <= cfg.burst_stop or (p.cycle == 'extension' and rh >= cfg.extension_rh) %}
                  {% set p.cycle = 'recovery' %}{% set p.end = now_ts + cfg.recovery_minutes * 60 %}
                {% elif now_ts >= p.end %}
                  {% if p.cycle == 'burst' and rh < cfg.extension_rh %}
                    {% set p.cycle = 'extension' %}{% set p.end = now_ts + cfg.burst_minutes * 60 %}
                  {% else %}
                    {% set p.cycle = 'recovery' %}{% set p.end = now_ts + cfg.recovery_minutes * 60 %}
                  {% endif %}
                {% endif %}
              {% endif %}
              {% if p.cycle == 'recovery' and now_ts >= p.end %}
                {% set p.cycle = 'normal' %}{% set p.end = 0 %}
              {% endif %}
              {% if p.cycle in ['burst', 'extension'] %}
                {% set p.mode = 'cool' %}
                {% set p.reason = 'Cooling burst' if p.cycle == 'burst' else 'Final cooling extension: humidity below ' ~ cfg.extension_rh ~ '%' %}
              {% elif p.cycle == 'recovery' %}
                {% set p.reason = 'Exhaust: required recovery between cooling bursts' %}
              {% elif restricted %}
                {% if temp > cfg.burst_at %}
                  {% set p.mode = 'cool' %}{% set p.cycle = 'burst' %}
                  {% set p.end = now_ts + cfg.burst_minutes * 60 %}
                  {% set p.reason = 'Cooling burst: bedroom above ' ~ cfg.burst_at ~ ' F' %}
                {% else %}
                  {% set p.reason = ('Night drying; waiting for bedtime selection. Aim for ' if overnight else 'Morning drying: aim for ') ~ cfg.dry_target ~ '% RH; warm-room release at ' ~ cfg.dry_release ~ '%' if p.morning else ('Exhaust: outdoor humidity protection' if p.protection else 'Exhaust: bedroom humidity above ' ~ cfg.dry_release ~ '%') %}
                {% endif %}
              {% elif rh > cfg.dry_release %}
                {% set p.reason = 'Exhaust: bedroom humidity above ' ~ cfg.dry_release ~ '%' %}
              {% elif temp >= cfg.cool_at or previous_mode == 'cool' or (event == 'manual' and requested == 'cool') %}
                {% set p.mode = 'cool' %}
                {% set p.reason = 'Cool: daytime control; humidity at or below ' ~ cfg.dry_release ~ '%' %}
              {% endif %}
              {% if event == 'manual' and requested == 'exhaust' and p.cycle == 'normal' %}
                {% set p.mode = 'exhaust' %}{% set p.reason = 'Exhaust requested; automatic control remains active' %}
              {% endif %}
            {% endif %}
            {{ dict(mode=p.mode, cycle=p.cycle, end=p.end, night=p.night, morning=p.morning,
              protection=p.protection, sleep_end=p.sleep_end, morning_at=p.morning_at, reason=p.reason) }}
      - if:
          - condition: "template"
            value_template: "{{ manual_active }}"
        then:
          - variables:
              plan: "{{ dict(plan, mode=states('input_select.bedroom_fan_manual_mode'), cycle='normal', end=0, reason='Manual: ' ~ states('input_select.bedroom_fan_manual_mode') ~ ' / ' ~ desired_speed ~ '; Auto resumes after hold') }}"
      - action: "{{ 'input_boolean.turn_on' if plan.night else 'input_boolean.turn_off' }}"
        target:
          entity_id: "input_boolean.bedroom_fan_night_phase"
      - action: "{{ 'input_boolean.turn_on' if plan.morning else 'input_boolean.turn_off' }}"
        target:
          entity_id: "input_boolean.bedroom_fan_morning_recovery"
      - action: "{{ 'input_boolean.turn_on' if plan.protection else 'input_boolean.turn_off' }}"
        target:
          entity_id: "input_boolean.bedroom_fan_humidity_protection"
      - action: "input_datetime.set_datetime"
        target:
          entity_id: "input_datetime.bedroom_fan_sleep_until"
