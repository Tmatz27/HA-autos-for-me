            data:
              timestamp: "{{ now().timestamp() + cfg.retry_seconds }}"
          - stop: "{{ 'Power unavailable or expired: ' ~ cfg.power ~ ' = ' ~ states(cfg.power) ~ '. Check the plug power sensor.' }}"
            error: true
      - if:
          - condition: "template"
            value_template: "{{ states('sensor.bedroom_fan_state') == 'off' }}"
        then:
          - if:
              - condition: "template"
                value_template: "{{ is_state(cfg.plug, 'off') }}"
            then:
              - action: "switch.turn_on"
                target:
                  entity_id: "switch.bedroom_fan_plug"
              - delay:
                  seconds: 4
          - if:
              - condition: "template"
                value_template: "{{ states('sensor.bedroom_fan_state') == 'off' and cfg.power_command != '' }}"
            then:
              - action: "remote.send_command"
                target:
                  entity_id: "remote.bedroom_fan_remote"
