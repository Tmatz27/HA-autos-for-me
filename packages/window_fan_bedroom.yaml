          - action: "input_datetime.set_datetime"
            target:
              entity_id: "input_datetime.bedroom_fan_retry_after"
            data:
              timestamp: "{{ now().timestamp() + cfg.retry_seconds }}"
          - stop: "Power feedback became invalid before sending commands."
            error: true
      - variables:
          current_state: "{{ states('sensor.bedroom_fan_state') }}"
          mode_order:
            - "cool"
            - "exhaust"
            - "circulate"
          speed_order:
            - "low"
            - "med"
            - "high"
      - variables:
          mode_presses: "{{ (mode_order.index(plan.mode) - mode_order.index(current_state.split('_')[0])) % 3 }}"
      - repeat:
