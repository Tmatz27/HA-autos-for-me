          - if:
              - condition: "template"
                value_template: "{{ not (is_number(states(cfg.power)) and states(cfg.power) | float >= 0 and states('sensor.bedroom_fan_state') in ['cool_low', 'cool_med', 'cool_high', 'exhaust_low', 'exhaust_med', 'exhaust_high', 'circulate_low', 'circulate_med', 'circulate_high'] and (cfg.power_max_age <= 0 or (now().timestamp() - as_timestamp(states[cfg.power].last_reported, 0)) <= cfg.power_max_age)) }}"
            then:
              - action: "input_text.set_value"
                target:
                  entity_id: "input_text.bedroom_fan_error"
                data:
                  value: "{{ 'Expected ' ~ (expected_state | default('running fan')) ~ '; read ' ~ states('sensor.bedroom_fan_state') ~ ' at ' ~ states(cfg.power) ~ ' W. No more presses sent; check the power update and calibration.' }}"
              - action: "input_datetime.set_datetime"
