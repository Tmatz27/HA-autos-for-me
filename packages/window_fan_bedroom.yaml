          timestamp: "{{ plan.end if plan.end > 0 else now_ts }}"
      - action: "input_text.set_value"
        target:
          entity_id: "input_text.bedroom_fan_reason"
        data:
          value: "{{ plan.reason }}"
      - if:
          - condition: "template"
            value_template: "{{ event == 'evaluate' and not manual_active and plan.cycle == cycle and plan.mode != previous_mode and not plan.night and not plan.morning and plan.morning_at == morning_at and not night and now_ts - (state_attr('input_datetime.bedroom_fan_last_command_time', 'timestamp') | float(0)) < cfg.minimum_mode_seconds and states('sensor.bedroom_fan_state') == previous_mode ~ '_high' }}"
        then:
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.bedroom_fan_reason"
            data:
              value: "Waiting for minimum mode interval; reevaluating each minute"
          - stop: "Avoid rapid changes between modes."
      - action: "input_select.select_option"
        target:
          entity_id: "input_select.bedroom_fan_requested_mode"
        data:
          option: "{{ plan.mode }}"
      - if:
          - condition: "template"
            value_template: "{{ event == 'evaluate' and now_ts < (state_attr('input_datetime.bedroom_fan_retry_after', 'timestamp') | float(0)) }}"
