          - stop: "Waiting after an unconfirmed command; see controller error."
      - variables:
          target_state: "{{ plan.mode ~ '_' ~ desired_speed }}"
      - if:
          - condition: "template"
            value_template: "{{ states('sensor.bedroom_fan_state') == target_state and is_number(states(cfg.power)) and states(cfg.power) | float >= 0 and states('sensor.bedroom_fan_state') in ['cool_low', 'cool_med', 'cool_high', 'exhaust_low', 'exhaust_med', 'exhaust_high', 'circulate_low', 'circulate_med', 'circulate_high'] and (cfg.power_max_age <= 0 or (now().timestamp() - as_timestamp(states[cfg.power].last_reported, 0)) <= cfg.power_max_age) }}"
        then:
          - action: "input_text.set_value"
            target:
              entity_id: "input_text.bedroom_fan_error"
            data:
              value: ""
          - stop: "Target already confirmed; no remote presses needed."
      - if:
          - condition: "template"
            value_template: "{{ not is_number(states(cfg.power)) or states(cfg.power) | float < 0 or (cfg.power_max_age > 0 and now().timestamp() - as_timestamp(states[cfg.power].last_reported, 0) > cfg.power_max_age) }}"
