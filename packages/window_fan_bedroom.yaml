automation:
  - alias: "Bedroom Fan - Continuous Control"
    id: "bedroom_fan_continuous_control_v2"
    mode: "single"
    max_exceeded: "silent"
    triggers:
      - trigger: "homeassistant"
        event: "start"
      - trigger: "time_pattern"
        minutes: "/1"
    actions:
      - action: "script.bedroom_fan_set_state"
        data:
          event: "evaluate"
  - alias: "Bedroom Fan - TV Turned Off"
    id: "bedroom_fan_tv_off_v2"
    mode: "single"
    triggers:
      - trigger: "state"
        entity_id: "media_player.bedtime_tv"
        to:
          - "off"
          - "standby"
          - "unavailable"
        for:
          seconds: 10
    conditions:
      - condition: "template"
        value_template: "{{ trigger.from_state is not none and trigger.from_state.state not in ['off','standby','unknown','unavailable'] }}"
    actions:
      - action: "script.bedroom_fan_set_state"
        data:
          event: "tv_off"
          event_at: "{{ as_timestamp(trigger.to_state.last_changed) }}"
  - alias: "Bedroom Fan - Manual Remote Cool"
    id: "bedroom_fan_manual_cool_v2"
    mode: "single"
    triggers:
      - trigger: "state"
        entity_id: "binary_sensor.bedroom_fan_is_cool"
        from: "off"
        to: "on"
        for:
          seconds: 8
    conditions:
      - condition: "template"
        value_template: "{{ is_state('script.bedroom_fan_set_state','off') and as_timestamp(trigger.to_state.last_changed, 0) > (state_attr('input_datetime.bedroom_fan_command_guard_until','timestamp') | float(0)) and as_timestamp(trigger.to_state.last_changed, 0) > (state_attr('input_datetime.bedroom_fan_last_command_time','timestamp') | float(0)) }}"
    actions:
      - action: "script.bedroom_fan_set_state"
        data:
          event: "observed_cool"
          event_at: "{{ as_timestamp(trigger.to_state.last_changed) }}"
