name: Controller and card validation
on:
  push:
    branches: [main, 'repair/**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-test.txt
      - run: python build.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: git diff --exit-code -- packages examples
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node tests/card.test.cjs
  home-assistant:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha: ['2024.10.4', '2026.10.1']
    steps:
      - uses: actions/checkout@v4
      - name: Check generated packages with official Home Assistant image
        run: >-
          docker run --rm --network none
          -v "${{ github.workspace }}:/workspace:ro" -w /workspace
          --entrypoint python
          ghcr.io/home-assistant/home-assistant:${{ matrix.ha }}
          tests/check_home_assistant.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [software, home-assistant]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release version matches the tag
        run: >-
          python -c "import os,den_controller; assert os.environ['GITHUB_REF_NAME'] == 'v'+den_controller.VERSION"
      - name: Build public release files
        run: python tools/build_release.py
      - name: Publish HACS release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "Window Fan Controller $GITHUB_REF_NAME"
          --notes-file docs/RELEASE-v1.7.0.md --latest
          dist/window-fan-card.js release/window-fan-control-*-examples.zip
