name: Controller and card validation
on:
  push:
    branches: [main, 'repair/**']
  pull_request:
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-test.txt
      - run: python build.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: git diff --exit-code -- packages examples
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node tests/card.test.cjs
  home-assistant:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha: ['2024.10.4', '2026.10.1']
    steps:
      - uses: actions/checkout@v4
      - name: Check generated packages with official Home Assistant image
        run: >-
          docker run --rm --network none
          -v "${{ github.workspace }}:/workspace:ro" -w /workspace
          --entrypoint python
          ghcr.io/home-assistant/home-assistant:${{ matrix.ha }}
          tests/check_home_assistant.py
